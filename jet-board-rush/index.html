/* ============================================================== 入力
   キーボード：↑/W/Space=ジャンプ ↓/S=しゃがみ ←/A=減速
   タッチ：画面左端=減速 / それ以外をタップ=ジャンプ（長押しで高く）
          押したまま下へスワイプ=しゃがみ                              */
const IN = {jumpHeld:false, jumpBuf:0, crouch:false, brake:false, anyPress:false};
const keys = Object.create(null);
function keyRole(code){
  if(code==='ArrowUp'||code==='KeyW'||code==='Space'||code==='KeyZ'||code==='KeyX') return 'jump';
  if(code==='ArrowDown'||code==='KeyS'||code==='KeyC') return 'crouch';
  if(code==='ArrowLeft'||code==='KeyA') return 'brake';
  return null;
}
addEventListener('keydown', e=>{
  if(e.code==='Escape'){ togglePause(); return; }
  if(e.code==='KeyM'){ Sound.toggle(); return; }
  if(e.code==='KeyG'){ setQuality((qIdx+1) % QUALITY.length, true); return; }
  if(e.code==='KeyR' && (G.state==='PLAY' || G.state==='DEAD' || (G.state==='RESULT' && G.resultT > 0.3))){
    startGame(true); return; }
  const r = keyRole(e.code);
  if(!r) return;
  e.preventDefault();
  if(!keys[e.code]){ keys[e.code]=1; if(r==='jump') IN.jumpBuf = P.buffer; }
  IN.anyPress = true;
  refreshKeys();
}, {passive:false});
addEventListener('keyup', e=>{ if(keys[e.code]){ delete keys[e.code]; refreshKeys(); } });
function refreshKeys(){
  let j=false,c=false,b=false;
  for(const k in keys){ const r=keyRole(k); if(r==='jump')j=true; else if(r==='crouch')c=true; else if(r==='brake')b=true; }
  IN.keyJump=j; IN.keyCrouch=c; IN.keyBrake=b;
  syncInput();
}
const pointers = new Map();
function ptRole(x){ return x < innerWidth*0.30 ? 'brake' : 'jump'; }
function syncInput(){
  let j=!!IN.keyJump, c=!!IN.keyCrouch, b=!!IN.keyBrake;
  pointers.forEach(p=>{ if(p.role==='jump') j=true; else if(p.role==='crouch') c=true; else if(p.role==='brake') b=true; });
  IN.jumpHeld=j; IN.crouch=c; IN.brake=b;
}
function onDown(e){
  const t = e.target;
  if(t && t.id==='sound') return;
  e.preventDefault();
  IN.anyPress = true;
  if(!pointers.size) Sound.unlock();
  const role = ptRole(e.clientX);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY, role});
  if(role==='jump') IN.jumpBuf = P.buffer;
  syncInput();
}
function onMove(e){
  const p = pointers.get(e.pointerId); if(!p) return;
  if(p.role==='jump' && e.clientY - p.y > 26){ p.role='crouch'; syncInput(); }
  else if(p.role==='crouch' && e.clientY - p.y < 8){ p.role='jump'; syncInput(); }
}
function onUp(e){ if(pointers.delete(e.pointerId)) syncInput(); }
addEventListener('pointerdown', onDown, {passive:false});
addEventListener('pointermove', onMove, {passive:false});
addEventListener('pointerup', onUp);
addEventListener('pointercancel', onUp);
addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('blur', ()=>{ for(const k in keys) delete keys[k]; pointers.clear(); refreshKeys(); });
/* ゲームパッド（あれば） */
function pollPad(){
  if(!navigator.getGamepads) return;
  const gp = navigator.getGamepads()[0]; if(!gp) return;
  syncInput();                                   // キー／タッチの状態に戻してから足す
  const a = gp.buttons[0]&&gp.buttons[0].pressed, up = (gp.buttons[12]&&gp.buttons[12].pressed)||gp.axes[1]<-0.5;
  const dn = (gp.buttons[13]&&gp.buttons[13].pressed)||gp.axes[1]>0.5;
  const lf = (gp.buttons[14]&&gp.buttons[14].pressed)||gp.axes[0]<-0.5;
  const j = a||up;
  if(j && !IN._padJ) IN.jumpBuf = P.buffer;
  IN._padJ = j;
  if(j) IN.jumpHeld=true;
  if(dn) IN.crouch=true;
  if(lf) IN.brake=true;
  if(j||dn||lf) IN.anyPress=true;
}

/* ============================================================== 音
   すべて WebAudio 合成。外部アセットなし。                            */
/* ------------------------------------------------------------------
   音響：コンプレッサ＋生成リバーブのミックスバスに、区間で変わる曲と効果音。
   曲は進行度で展開する：
     main  … 4つ打ち前の本編（キック・スネア・ハット・ベース・アルペジオ）
     calm  … 黄金時間の息継ぎ（ドラムが抜けてパッドとアルペジオだけ）
     rise  … 大下り坂（ノイズの上昇音とスネアロールで溜める）
     storm … ゲート以降（4つ打ち・リード・テンポ上昇で全部入り）       */
const mtof = m => 440*Math.pow(2, (m-69)/12);
const CHORDS = [ [45,48,52], [41,45,48], [48,52,55], [43,47,50] ];   // Am F C G（ルート＋3度＋5度）
const LEAD = [81,null,84,null,88,null,86,84,  81,null,null,79,81,null,84,null,
              77,null,81,null,84,null,86,null, 88,null,86,null,84,null,83,null,
              84,null,88,null,91,null,88,86,   84,null,null,81,84,null,88,null,
              86,null,83,null,79,null,83,null, 86,null,88,null,86,84,83,null];
const Sound = {
  ctx:null, on:true, ready:false, bgmOn:false, nextNote:0, step:0, section:'main', tempo:128, riseAt:0,
  unlock(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c = this.ctx = new AC();
    /* ミックスバス：master → compressor → 出力。リバーブはセンドで混ぜる */
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -16; this.comp.ratio.value = 4; this.comp.attack.value = 0.004; this.comp.release.value = 0.2;
    this.master = c.createGain(); this.master.gain.value = this.on ? 0.9 : 0;
    this.master.connect(this.comp).connect(c.destination);
    this.verb = c.createConvolver(); this.verb.buffer = this.impulse(2.2);
    this.verbG = c.createGain(); this.verbG.gain.value = 0.22;
    this.verb.connect(this.verbG).connect(this.master);
    this.musicG = c.createGain(); this.musicG.gain.value = 0.34; this.musicG.connect(this.master);
    this.musicG.connect(this.verb);
    this.sfxG = c.createGain(); this.sfxG.gain.value = 0.6; this.sfxG.connect(this.master);
    this.sfxVerb = c.createGain(); this.sfxVerb.gain.value = 0.35; this.sfxG.connect(this.sfxVerb); this.sfxVerb.connect(this.verb);
    /* ベースはキックでへこませる（サイドチェイン風） */
    this.bassBus = c.createGain(); this.bassBus.gain.value = 1; this.bassBus.connect(this.musicG);
    this.padBus = c.createGain(); this.padBus.gain.value = 0; this.padBus.connect(this.musicG);
    /* ノイズ源（ブラウン寄り）と白色ノイズ */
    const len = c.sampleRate*2;
    const bn = c.createBuffer(1, len, c.sampleRate), d = bn.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
    this.noise = bn;
    const wn = c.createBuffer(1, len, c.sampleRate), e = wn.getChannelData(0);
    for(let i=0;i<len;i++) e[i] = Math.random()*2-1;
    this.white = wn;
    /* 風：速度で音量と帯域が変わる。高速ほど「ヒュー」と鳴る */
    const ns = c.createBufferSource(); ns.buffer = wn; ns.loop = true;
    const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=600; bp.Q.value=0.8;
    this.windG = c.createGain(); this.windG.gain.value = 0;
    ns.connect(bp).connect(this.windG).connect(this.master); ns.start();
    this.windF = bp;
    /* ジェット：のこぎり波2本を少しずらして太くする */
    this.jetG = c.createGain(); this.jetG.gain.value = 0;
    const jf = c.createBiquadFilter(); jf.type='lowpass'; jf.frequency.value=380; jf.Q.value=2;
    this.jetF = jf; jf.connect(this.jetG).connect(this.master);
    this.jetO = c.createOscillator(); this.jetO.type='sawtooth'; this.jetO.frequency.value=70;
    this.jetO2 = c.createOscillator(); this.jetO2.type='sawtooth'; this.jetO2.frequency.value=70.7;
    this.jetO.connect(jf); this.jetO2.connect(jf); this.jetO.start(); this.jetO2.start();
    /* 勢いが乗っているときの唸り */
    this.boostG = c.createGain(); this.boostG.gain.value = 0;
    this.boostO = c.createOscillator(); this.boostO.type='triangle'; this.boostO.frequency.value=220;
    this.boostO.connect(this.boostG).connect(this.master); this.boostO.start();
    this.ready = true;
  },
  impulse(sec){
    const c=this.ctx, n=Math.floor(c.sampleRate*sec), b=c.createBuffer(2, n, c.sampleRate);
    for(let ch=0; ch<2; ch++){ const d=b.getChannelData(ch);
      for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 2.6); }
    return b;
  },
  toggle(){ this.on=!this.on; if(this.master) this.master.gain.value=this.on?0.9:0;
            document.getElementById('sound').textContent = this.on?'♪':'✕'; },
  now(){ return this.ctx ? this.ctx.currentTime : 0; },
  env(node, t, a, d, peak, dest){
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t+a);
    g.gain.exponentialRampToValueAtTime(0.0001, t+a+d);
    node.connect(g); if(dest) g.connect(dest); return g;
  },
  tone(freq, dur, type, vol, slide, when, dest){
    if(!this.ready||!this.on) return;
    const c=this.ctx, t=(when||c.currentTime);
    const o=c.createOscillator(); o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), t+dur);
    this.env(o, t, 0.006, dur, vol||0.25, dest||this.sfxG);
    o.start(t); o.stop(t+dur+0.05);
  },
  noiseHit(t, dur, vol, type, f0, f1, dest, white){
    if(!this.ready) return;
    const c=this.ctx, s=c.createBufferSource(); s.buffer = white ? this.white : this.noise;
    const f=c.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.setValueAtTime(f0,t);
    if(f1) f.frequency.exponentialRampToValueAtTime(f1, t+dur);
    s.connect(f); this.env(f, t, 0.003, dur, vol, dest||this.sfxG);
    s.start(t, Math.random()*1.5); s.stop(t+dur+0.05);
  },
  burst(dur, vol, freq){ if(this.ready&&this.on) this.noiseHit(this.now(), dur, vol, 'bandpass', freq||900, 120); },

  /* ---------------- 効果音 ---------------- */
  jump(){ const t=this.now(); if(!this.ready||!this.on) return;
    this.noiseHit(t, 0.18, 0.22, 'bandpass', 700, 2600, null, true);
    this.tone(330, 0.10, 'triangle', 0.14, 620, t); },
  land(){ const t=this.now(); if(!this.ready||!this.on) return;
    this.tone(95, 0.16, 'sine', 0.35, 48, t);
    this.noiseHit(t, 0.14, 0.26, 'lowpass', 1400, 300); },
  coin(chain){ if(!this.ready||!this.on) return; const t=this.now(), k=Math.pow(2,(chain||0)/12);
    this.tone(1318*k, 0.25, 'sine', 0.16, null, t); this.tone(1976*k, 0.18, 'sine', 0.09, null, t+0.004);
    this.tone(2637*k, 0.06, 'square', 0.03, null, t); },
  wear(){ const t=this.now();
    [523,659,784,1046].forEach((f,i)=> this.tone(f,0.16,'triangle',0.2,null,t+i*0.055)); },
  near(){ if(!this.ready||!this.on) return; const t=this.now();
    this.noiseHit(t, 0.16, 0.30, 'highpass', 3000, 9000, null, true);
    this.tone(1760, 0.08, 'sine', 0.08, 2800, t); },
  hurt(){ if(!this.ready||!this.on) return; const t=this.now();
    this.tone(160, 0.3, 'sawtooth', 0.26, 55, t);
    for(let i=0;i<5;i++) this.noiseHit(t+i*0.035+Math.random()*0.02, 0.05, 0.28, 'bandpass', 2400+Math.random()*1800);  // 布が裂ける音
  },
  dead(){ const t=this.now();
    [392,330,262,196].forEach((f,i)=> this.tone(f,0.26,'square',0.22,f*0.7,t+i*0.13));
    if(this.ready&&this.on) this.noiseHit(t, 0.6, 0.35, 'lowpass', 900, 80); },
  clear(){ if(!this.ready||!this.on) return; const t=this.now();
    [523,659,784,1046,1318,1568].forEach((f,i)=>{ this.tone(f,0.5,'triangle',0.2,null,t+i*0.09);
                                                  this.tone(f*2,0.3,'sine',0.06,null,t+i*0.09); });
    this.crash(t); },
  launch(){ if(!this.ready||!this.on) return; const t=this.now();
    this.noiseHit(t, 0.5, 0.34, 'lowpass', 300, 3200, null, true);
    this.tone(110, 0.45, 'sawtooth', 0.16, 330, t); },
  go(){ if(!this.ready||!this.on) return; const t=this.now();
    [440,554,659,880].forEach((f,i)=> this.tone(f, 0.22, 'sawtooth', 0.10, null, t+i*0.03));
    this.noiseHit(t, 0.4, 0.2, 'highpass', 1500, 7000, null, true); },
  stamp(){ if(!this.ready||!this.on) return; const t=this.now();
    this.tone(120, 0.22, 'sine', 0.5, 50, t); this.noiseHit(t, 0.12, 0.3, 'lowpass', 2000, 200); },
  tick(){ if(!this.ready||!this.on) return; this.tone(1600, 0.03, 'square', 0.05); },
  trick(){ const t=this.now();
    [784,988,1175,1568,1976].forEach((f,i)=> this.tone(f,0.18,'triangle',0.18,null,t+i*0.04)); },
  gate(){ if(!this.ready||!this.on) return; const t=this.now();
    this.crash(t); this.tone(55, 0.9, 'sine', 0.55, 38, t);
    [330,440,554,660].forEach((f,i)=> this.tone(f, 0.6, 'sawtooth', 0.12, f*1.5, t+i*0.04)); },
  crash(t){ this.noiseHit(t, 1.6, 0.28, 'highpass', 5200, 3800, this.sfxG, true); },

  /* 風・ジェット・勢いの唸りを速度に追従させる */
  speed(v, brake, boost){
    if(!this.ready) return;
    const k = clamp((v-6)/18, 0, 1), c=this.ctx, t=c.currentTime;
    this.windG.gain.setTargetAtTime(0.05 + k*0.20, t, 0.1);
    this.windF.frequency.setTargetAtTime(420 + k*1900, t, 0.1);
    this.jetG.gain.setTargetAtTime(brake ? 0.03 : 0.045 + k*0.06, t, 0.08);
    const jf = 48 + k*52 + (brake?-12:0);
    this.jetO.frequency.setTargetAtTime(jf, t, 0.1); this.jetO2.frequency.setTargetAtTime(jf*1.012, t, 0.1);
    this.jetF.frequency.setTargetAtTime(300 + k*700, t, 0.1);
    const b = clamp(((boost||0)-1.5)/5, 0, 1);
    this.boostG.gain.setTargetAtTime(b*0.045, t, 0.15);
    this.boostO.frequency.setTargetAtTime(180 + b*260, t, 0.2);
  },
  quiet(){ if(!this.ready) return; const t=this.ctx.currentTime;
    this.windG.gain.setTargetAtTime(0, t, 0.05); this.jetG.gain.setTargetAtTime(0, t, 0.05);
    this.boostG.gain.setTargetAtTime(0, t, 0.05); },

  /* ---------------- 曲 ---------------- */
  startBGM(){ this.bgmOn=true; this.step=0; this.section='main'; this.tempo=128;
              if(this.ctx){ this.nextNote=this.ctx.currentTime+0.06; this.padBus.gain.setValueAtTime(0.0, this.ctx.currentTime); } },
  stopBGM(){ this.bgmOn=false; if(this.ready) this.padBus.gain.setTargetAtTime(0, this.ctx.currentTime, 0.3); },
  setSection(sec){
    if(sec===this.section) return;
    this.section = sec;
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    this.padBus.gain.setTargetAtTime(sec==='calm' ? 1.0 : (sec==='rise' ? 0.7 : 0.35), t, 0.6);
    if(sec==='rise') this.riseAt = t;
  },
  kick(t, v){ const c=this.ctx, o=c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(155, t); o.frequency.exponentialRampToValueAtTime(42, t+0.12);
    this.env(o, t, 0.002, 0.32, 0.9*v, this.musicG); o.start(t); o.stop(t+0.4);
    const g = this.bassBus.gain; g.cancelScheduledValues(t); g.setValueAtTime(0.25, t); g.linearRampToValueAtTime(1, t+0.16); },
  snare(t, v){ this.noiseHit(t, 0.16, 0.38*v, 'bandpass', 1900, 1200, this.musicG, true);
    const o=this.ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(210,t); o.frequency.exponentialRampToValueAtTime(140,t+0.08);
    this.env(o, t, 0.002, 0.09, 0.22*v, this.musicG); o.start(t); o.stop(t+0.15); },
  hat(t, v, open){ this.noiseHit(t, open ? 0.18 : 0.035, 0.13*v, 'highpass', 7800, null, this.musicG, true); },
  bass(t, m, dur){ const c=this.ctx, o=c.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(mtof(m), t);
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(220, t+dur);
    o.connect(f); this.env(f, t, 0.005, dur, 0.34, this.bassBus); o.start(t); o.stop(t+dur+0.05); },
  pluck(t, m, v){ const c=this.ctx, o=c.createOscillator(); o.type='square'; o.frequency.setValueAtTime(mtof(m), t);
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(3200,t); f.frequency.exponentialRampToValueAtTime(600, t+0.18);
    o.connect(f); this.env(f, t, 0.003, 0.2, 0.10*v, this.musicG); o.start(t); o.stop(t+0.25); },
  pad(t, chord, dur){ const c=this.ctx;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 1300; f.connect(this.padBus);
    for(const m of chord) for(const det of [-7, 6]){
      const o=c.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(mtof(m+12), t); o.detune.value = det;
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.028, t+0.5);
      g.gain.setValueAtTime(0.028, t+dur-0.4); g.gain.linearRampToValueAtTime(0.0001, t+dur+0.3);
      o.connect(g).connect(f); o.start(t); o.stop(t+dur+0.35);
    }},
  lead(t, m, dur){ const c=this.ctx, o=c.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(mtof(m), t);
    const vib=c.createOscillator(); vib.frequency.value=5.5; const vg=c.createGain(); vg.gain.value=6;
    vib.connect(vg).connect(o.detune); vib.start(t); vib.stop(t+dur+0.1);
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2600; f.Q.value=3;
    o.connect(f); this.env(f, t, 0.01, dur, 0.09, this.musicG); o.start(t); o.stop(t+dur+0.1); },
  update(sec){
    if(!this.ready||!this.bgmOn||!this.on) return;
    this.setSection(sec);
    const c=this.ctx;
    const want = sec==='storm' ? 140 : (sec==='rise' ? 134 : 128);
    this.tempo += (want-this.tempo)*0.02;
    while(this.nextNote < c.currentTime + 0.2){
      const t=this.nextNote, s=this.step, spb=60/this.tempo/4;
      const bar=(s>>4)&3, beat=s&15, ch=CHORDS[bar];
      const S = this.section;
      /* パッドは小節頭に1回 */
      if(beat===0) this.pad(t, ch, spb*16);
      if(S==='main' || S==='storm'){
        if(beat%4===0 && (S==='storm' || beat===0 || beat===8)) this.kick(t, 1);
        if(S==='main' && beat===10 && (s>>4)%2===1) this.kick(t, 0.8);
        if(beat===4 || beat===12) this.snare(t, 1);
        this.hat(t, beat%2 ? 0.55 : 1, S==='storm' && beat%4===2);
        if(beat%2===0) this.bass(t, ch[0] - (beat%8===4 ? 0 : 12) + 12, spb*1.8);
      }
      if(S==='calm'){
        if(beat%4===2) this.hat(t, 0.5, false);
        if(beat===0) this.bass(t, ch[0], spb*14);
      }
      if(S==='rise'){
        /* だんだん細かくなるスネアロール＋ノイズの上昇 */
        const el = c.currentTime - this.riseAt;
        const div = el < 1.2 ? 4 : (el < 2.2 ? 2 : 1);
        if(beat % div === 0) this.snare(t, 0.35 + Math.min(0.65, el*0.3));
        if(beat===0) this.noiseHit(t, spb*16, 0.22, 'highpass', 400, 6000, this.musicG, true);
        if(beat%4===0) this.kick(t, 0.7);
      }
      /* アルペジオ（全区間） */
      if(beat%2===0 || S==='storm'){
        const idx = [0,1,2,1, 0,2,1,2][(s>>1)%8];
        const up = (beat===0||beat===8) ? 12 : 0;
        this.pluck(t, ch[idx] + 24 + up, S==='calm' ? 0.8 : 1);
      }
      if(S==='storm'){
        const m = LEAD[(s>>1)%64];
        if(beat%2===0 && m) this.lead(t, m, spb*1.8);
      }
      this.step=(s+1)&63; this.nextNote += spb;
    }
  }
};

function makeRecord(g, sc, cleared){
  return { v:1, game:'jet-board-rush', stage:g.world.id, climate:g.world.climate,
           cleared:cleared, score:sc.total, timeMs:Math.round(g.timeMs),
           coins:g.coins, near:g.near, tricks:g.tricks, distance:Math.round(g.dist), damage:g.dmg,

}
function computeScore(g, cleared){
  const coinPts = g.coins*120;
  const nearPts = g.near*P.nearPts;
  const trickPts = g.tricks*150;
  const distPts = Math.floor(g.dist)*3;
  const clearB  = cleared ? 3000 : 0;
  const timeB   = cleared ? Math.max(0, Math.round((115 - g.timeMs/1000)*80)) : 0;
  const dmgB    = cleared ? (g.dmg===0 ? 2500 : (g.dmg===1 ? 900 : 0)) : 0;
  return {coinPts, nearPts, trickPts, distPts, clearB, timeB, dmgB,
          total:coinPts+nearPts+trickPts+distPts+clearB+timeB+dmgB};
}

function nearMiss(x, y){
  if(G.state!=='PLAY' || G.invuln>0) return;
  buzz(8);
  G.chain = G.chainT > 0 ? Math.min(G.chain+1, 5) : 1;
  G.chainT = 2.0;
  G.near += G.chain;                     // 連続でかすめるほど1回の価値が上がる
  emitSpark(x, y);
  Sound.near();
  UI.pop.classList.remove('trick');
  UI.pop.textContent = '+'+(P.nearPts*G.chain) + (G.chain>1 ? ' ×'+G.chain : '');
  G.popT = 0.7;
}

/* --------------------------------------------------------- 被弾・死亡 */
function flash(a){ UI.flash.style.transition='none'; UI.flash.style.opacity=a;
  requestAnimationFrame(()=>{ UI.flash.style.transition='opacity .35s'; UI.flash.style.opacity=0; }); }
function hurt(){
  if(G.invuln>0 || G.state!=='PLAY') return;
  G.dmg++;
  if(G.clothes){
    G.clothes = false;
    for(const c of rider.userData.clothes) c.visible = false;
    emitDebris(G.px, G.py+1.0, 0);
    G.invuln = P.invuln; G.hitT = P.hitTime; G.shake = 0.55;
    G.hitStop = 0.09; buzz(60); G.flip = -1;
    G.boost = Math.max(P.boostMin, G.boost - P.boostHit);
    flash(0.45); Sound.hurt();
  }else{
    die();
  }
}
function die(){
  if(G.state!=='PLAY') return;
  G.state='DEAD'; G.deadT=0; G.shake=0.7; flash(0.5);
  G.hitStop = 0.14; buzz([80,40,120]);
  Sound.dead(); Sound.stopBGM(); Sound.quiet();
  emitSpray(G.px, G.py+0.4, 0, 26, 6, 4);
}
function finish(){
  if(G.state!=='PLAY') return;
  G.slowT = 0.9; G.slowK = 0.35; emitBurst(G.px+1, G.py+2, 90, COL.gold); emitBurst(G.px+1, G.py+3, 60, COL.ice);
  G.state='CLEAR'; G.clearT=0; Sound.clear(); Sound.stopBGM();
}
function rankOf(score, cleared){
  const r = score >= 25000 ? 'S' : score >= 20000 ? 'A' : score >= 14000 ? 'B' : score >= 8000 ? 'C' : 'D';
  return (!cleared && (r==='S' || r==='A')) ? 'B' : r;
}

  const prevBestTime = prevClears.length ? Math.min(...prevClears.map(r=>r.timeMs)) : null;
  Store.add(rec);
  /* 最速クリアならゴーストを更新 */
  if(cleared && (!ghostData || G.timeMs < ghostData.timeMs)){
    ghostData = { v:1, timeMs:Math.round(G.timeMs), gateMs:Math.round(recRun.gateMs), s:recRun.s.slice() };
    GhostStore.save(ghostData);
  }
  UI.rtitle.textContent = cleared ? 'GOAL!' : 'WIPEOUT';
  UI.rtitle.className = cleared ? 'clear' : 'fail';
  UI.rsub.textContent = cleared ? world.name+' CLEAR' : Math.round(G.dist)+' m / '+Math.round(world.length)+' m';
  const rows = [];
  rows.push(['TIME', fmtTime(G.timeMs)]);
  rows.push(['❄ CRYSTAL', G.coins+' × 120 = '+sc.coinPts.toLocaleString()]);
  if(G.near) rows.push(['NEAR MISS', G.near+' × '+P.nearPts+' = '+sc.nearPts.toLocaleString()]);
  if(G.tricks) rows.push(['FLIP', G.tricks+' × 150 = '+sc.trickPts.toLocaleString()]);
  rows.push(['DISTANCE', Math.round(G.dist)+' m = '+sc.distPts.toLocaleString()]);
  if(cleared){
    rows.push(['GOAL', '+'+sc.clearB.toLocaleString()]);
    if(sc.timeB) rows.push(['SPEED', '+'+sc.timeB.toLocaleString()]);
    if(sc.dmgB)  rows.push([G.dmg===0?'NO DAMAGE':'ONLY ONCE', '+'+sc.dmgB.toLocaleString()]);
  }
  UI.sheet.innerHTML = rows.map(r=>`<div class="l">${r[0]}</div><div class="v">${r[1]}</div>`).join('');
  const isNew = !prevBest || sc.total > prevBest.score;
  UI.newbest.style.display = 'none';
  /* ベストタイムとの差 */
  UI.delta.className = ''; UI.delta.textContent = '';
  if(cleared && prevBestTime!==null){
    const d = (G.timeMs - prevBestTime)/1000;
    UI.delta.className = d <= 0 ? 'fast' : 'slow';
    UI.delta.textContent = 'BEST TIME ' + (d <= 0 ? '−' : '+') + Math.abs(d).toFixed(2) + 's';
  }
  UI.rank.className = ''; UI.rank.textContent = rankOf(sc.total, cleared);
  UI.result.classList.remove('hidden');
  UI.hud.classList.add('off');
  Sound.quiet();
  showBest();
  G.resultT = 0;
  /* 行を順に出し、スコアを数え上げ、最後にランクの判子を押す */
  const cells = [...UI.sheet.children];
  cells.forEach((c,i)=> setTimeout(()=>c.classList.add('in'), 90 + Math.floor(i/2)*85));
  const t0 = performance.now() + 220, dur = 900, total = sc.total;
  let lastTick = 0;
  (function count(now){
    const k = clamp((now - t0)/dur, 0, 1), e = 1 - Math.pow(1-k, 3);
    UI.total.textContent = Math.round(total*e).toLocaleString();
    if(now - lastTick > 55 && k > 0 && k < 1){ Sound.tick(); lastTick = now; }
    if(k < 1) requestAnimationFrame(count);
    else {
      UI.rank.classList.add('stamp', UI.rank.textContent); Sound.stamp(); buzz(30);
      if(isNew) UI.newbest.style.display = 'block';
    }
  })(performance.now());
}

/* ======================================================== ゲーム進行 */
const _m4 = new THREE.Object3D();
function supportAt(x, maxY){
  let best = null;
  for(const s of world.surfaces){
    if(x < s.x0 || x > s.x1) continue;
    const sy = surfY(s, x);
    if(sy <= maxY && (best===null || sy > best.y)) best = {y:sy, s:s};
  }
  return best;
}
function groundYAt(x, maxY){ const b = supportAt(x, maxY); return b ? b.y : null; }
/* 地面（浮き足場や氷塊を除く）の高さ。敵とカメラが使う */
function terrainY(x){
  for(const s of world.surfaces)
    if(s.kind==='ground' && x>=s.x0 && x<=s.x1) return surfY(s, x);
  return null;
}
/* 踏み切り坂の効果。跳んだ勢いに坂ぶんを上乗せする（1回の踏み切りにつき1度だけ） */
function rampBoost(){
  if(G.rampT <= 0) return;
  const boost = Math.min(G.speed*G.rampM*0.95, 12);
  G.vy = Math.min(G.vy + boost, 21);
  G.rampT = 0;
  if(boost > 3.0){
    emitSpray(G.px-0.4, G.py, 0, 16, 4, 3.4);
    Sound.launch(); G.shake = Math.max(G.shake, 0.28);
    /* 大きく飛んだら自動で宙返り。着地までに回り切るよう滞空時間から速さを決める */
    if(G.vy > 15 && G.state==='PLAY'){ G.flip = 0; G.flipDur = Math.max(0.55, 2*G.vy/P.gravity*0.86); G.apexSlow = true; }
  }
}
function flipDone(){
  G.flip = -1; G.tricks++;
  rider.rotation.z -= Math.PI*2;
  UI.pop.textContent = 'FLIP +150'; UI.pop.classList.add('trick'); G.popT = 0.9;
  emitBurst(G.px, G.py+1.2, 26, COL.gold); Sound.trick(); buzz(20);
}
function stepPlay(dt){
  G.crouching = IN.crouch;
  const h = G.crouching ? P.crouchH : P.standH;
  /* --- 速度 --- */
  const prog = clamp(G.px/world.length, 0, 1);
  const onIce = G.onGround && inIce(world, G.px);
  G.iceOn = onIce;
  let target = speedAt(world, prog);
  if(onIce) target *= P.iceMul;
  if(IN.brake){
    let bf = onIce ? lerp(1, P.brakeMul, P.iceBrake) : P.brakeMul;
    if(!G.onGround) bf = lerp(1, bf, 0.55);
    target *= bf;
  }
  if(G.hitT>0) target *= P.hitMul;
  /* 坂にいるあいだの倍率（その場の伸び） */
  if(G.onGround && G.groundSlope) target *= clamp(1 - G.groundSlope*P.slopeGain, P.slopeMin, P.slopeMax);
  /* 勢い：下りで貯まり、上りで減り、平地ではほとんど減らない。
     ブレーキは「稼いだ勢いを捨てる」ので、速さと引き換えの操作になる */
  if(G.onGround && G.groundSlope < -0.02)      G.boost += (-G.groundSlope)*P.boostGain*(G.speed/15)*dt;
  else if(G.onGround && G.groundSlope > 0.02)  G.boost -= ( G.groundSlope)*P.boostGain*(G.speed/15)*dt;
  else if(G.boost)                             G.boost -= Math.sign(G.boost)*Math.min(Math.abs(G.boost), P.boostDecay*dt);
  if(IN.brake) G.boost -= P.boostBrake*dt;
  G.boost = clamp(G.boost, P.boostMin, P.boostMax);
  target = Math.min(target + G.boost, P.speedCap);
  const k = target < G.speed ? 4.2 : 2.0;
  G.speed += (target-G.speed)*(1-Math.exp(-k*dt));
  G.px += G.speed*dt;
  G.dist = G.px;

  /* --- 縦移動 --- */
  if(IN.jumpBuf>0 && (G.onGround || G.coyote>0)){
    G.vy = P.jumpV; G.onGround=false; G.coyote=0; IN.jumpBuf=0; G.jumpCut=false;
    Sound.jump(); emitSpray(G.px-0.4, G.py+0.1, 0, 8, 3, 2.2);
    rampBoost();                      // 踏み切り坂の上（を離れた直後まで）なら大きく飛ぶ
  }
  if(!G.jumpCut && G.vy>0 && !IN.jumpHeld){ G.vy *= P.cutJump; G.jumpCut = true; }
  const prevFeet = G.py, wasGround = G.onGround, jumped = G.vy > 0.001;
  G.vy -= P.gravity*dt;
  G.py += G.vy*dt;

  let sup = null;
  if(!jumped){
    /* 上り坂を登る余裕（climb）と、下り坂に貼り付く余裕（stick） */
    const climb = wasGround ? G.speed*dt*1.35 + 0.06 : 0.06;
    const stick = wasGround ? G.speed*dt*1.20 + 0.30 : 0;
    const cand = supportAt(G.px, prevFeet + climb);
    if(cand && (G.py <= cand.y || G.py - cand.y <= stick)) sup = cand;
  }
  if(G.apexSlow && G.flip >= 0 && G.vy <= 0){ G.apexSlow = false; G.slowT = 0.32; G.slowK = 0.42; }
  if(sup){
    if(!wasGround){
      Sound.land(); emitSpray(G.px-0.3, sup.y+0.05, 0, 10, 3.2, 2.4);
      if(G.airT > 0.3) emitRing(G.px, sup.y, 12 + Math.min(14, Math.floor(G.airT*14)), 5 + G.airT*5);
      G.landImpact = Math.min(1, Math.abs(G.vy)*0.045 + G.airT*0.5);
      if(G.airT > 0.45) buzz(14);
      if(G.flip >= 0){
        if(G.flip/G.flipDur > 0.72) flipDone();
        else { G.flip = -1; if(rider.rotation.z > Math.PI) rider.rotation.z -= Math.PI*2; }
      }
      G.camDip = Math.min(0.85, Math.abs(G.vy)*0.035 + 0.12);   // 着地の沈み込み
      /* 縁すれすれの着地もニアミス扱い */
      if(G.airT > 0.28 && G.px - sup.s.x0 < 1.5 && sup.s.x0 > 1) nearMiss(G.px, sup.y+0.6);
    }
    G.py = sup.y; G.vy = 0; G.onGround = true; G.coyote = P.coyote; G.jumpCut = false;
    G.groundSlope = surfSlope(sup.s); G.lastY = sup.y; G.airT = 0;
    if(G.groundSlope > 0.12){ G.rampT = 0.50; G.rampM = G.groundSlope; }
    else G.rampT = Math.max(0, G.rampT - dt);
  }else{
    G.airT += dt;
    if(wasGround){
      G.onGround = false; G.coyote = P.coyote;
      rampBoost();                    // 跳ばずに坂の先端から飛び出した場合
    }
    G.coyote -= dt;
  }
  if(G.py < G.lastY - P.fallDrop){ G.lastHit={src:'fall', x:+G.px.toFixed(1)}; die(); return; }

  /* --- 障害物（すり抜けざま、どれだけ際どかったかを記録する） --- */
  const top = G.py + h, x0 = G.px-P.bodyW/2, x1 = G.px+P.bodyW/2;
  for(const hz of world.hazards){
    if(x1 < hz.x0 || x0 > hz.x1){
      if(hz._clr!=null && x0 > hz.x1){
        if(hz.type!=='low' && hz._clr < P.nearMiss) nearMiss(hz.cx, hz.y1+0.3);
        hz._clr = null;
      }
      continue;
    }
    if(hz.type!=='low'){
      const clr = G.py - hz.y1;
      hz._clr = hz._clr==null ? clr : Math.min(hz._clr, clr);
    }
    if(top > hz.y0 && G.py < hz.y1){
      G.lastHit={src:hz.type, x:+hz.cx.toFixed(1), crouch:G.crouching, py:+G.py.toFixed(2),
                 y0:+hz.y0.toFixed(2)};
      hurt(); break; }
  }
  /* --- 敵 --- */
  for(const e of world.enemies){
    const d = ENEMY_DEF[e.kind];
    const near = Math.abs(e.x - G.px) < 70;
    if(e.x - G.px < 30) e.x -= d.spd*dt;      // 近づいてから動き出す（配置が崩れない）
    if(!near) continue;
    const gy = terrainY(e.x);
    if(gy!==null) e.y = gy + e.dy;
    const ey = e.kind==='flyer' ? e.y + Math.sin(G.t*3+e.ph)*0.22 : e.y;
    if(x1 > e.x-d.w/2 && x0 < e.x+d.w/2){
      const clr = e.kind==='flyer' ? ey - top : G.py - (ey+d.h);
      e._clr = e._clr==null ? clr : Math.min(e._clr, clr);
    }else if(e._clr!=null && x0 > e.x+d.w/2){
      if(e._clr < P.nearMiss) nearMiss(e.x, ey+d.h*0.5); e._clr = null;
    }
    if(x1 > e.x-d.w/2 && x0 < e.x+d.w/2 && top > ey && G.py < ey+d.h){
      G.lastHit={src:'enemy:'+e.kind, x:+e.x.toFixed(1), crouch:G.crouching, py:+G.py.toFixed(2)};
      hurt(); break; }
  }
  /* --- アイテム --- */
  for(const it of world.items){
    if(it.got || G.state!=='PLAY') continue;
    if(Math.abs(it.x - G.px) > 2) continue;
    const cy = G.py + h*0.5;
    if(Math.abs(it.x-G.px) < 0.95 && Math.abs(it.y-cy) < 1.15){
      it.got = true;
      if(it.type==='coin'){
        G.coinChain = G.coinT > 0 ? Math.min(G.coinChain+1, 14) : 0; G.coinT = 0.75;
        G.coins++; Sound.coin(G.coinChain); emitPickup(it.x, it.y); bumpHud();
      }
      else {
        emitPickup(it.x, it.y, COL.warm);
        if(!G.clothes){ G.clothes=true; for(const c of rider.userData.clothes) c.visible=true; flash(0.2); }
        else G.coins += 5;
        Sound.wear();
      }
      if(it.mesh) it.mesh.visible=false;
    }
  }
  /* --- 最終区間に入った合図 --- */
  for(const g of world.gates){
    if(!g.fired && G.px > g.x){
      g.fired = true; G.rush = true; G.gateT = 0.5; G.slowT = 0.38; G.slowK = 0.45; buzz([40,30,40]);
      recRun.gateMs = G.timeMs;
      showSplit();
      emitBurst(G.px+2, G.py+3, 70, COL.ice); emitBurst(G.px+2, G.py+5, 40, COL.gold);
      G.shake = Math.max(G.shake, 0.5); flash(0.30); Sound.gate();
    }
  }
  /* --- ヒント --- */
  if(G.state==='PLAY') for(const hint of world.hints){
    if(!hint.fired && G.px > hint.x){ hint.fired=true; showHint(hint.icon); }
  }
  /* --- タイマー・ゴール --- */
  if(G.state==='PLAY') G.timeMs += dt*1000;
  if(G.invuln>0) G.invuln -= dt;
  if(G.hitT>0) G.hitT -= dt;
  if(G.chainT>0) G.chainT -= dt;
  if(G.coinT>0) G.coinT -= dt;
  if(IN.jumpBuf>0) IN.jumpBuf -= dt;
  if(G.px >= world.goalX) finish();
}

function autoPilot(dt){
  const v = Math.max(1, G.speed);
  IN.crouch = world.hazards.some(h=>h.type==='low' && G.px > h.x0 - v*0.5 && G.px < h.x1+0.8);
  let want = false;
  for(const h of world.hazards)
    if(h.type!=='low'){ const t=(h.x0-G.px)/v; if(t>0 && t<0.28) want = true; }
  for(let d=0; d<40; d+=0.5){
    const x = G.px+d;
    if(!world.surfaces.some(su=>su.kind!=='block' && x>=su.x0 && x<=su.x1)){
      if(d < Math.max(1.0, v*0.09)) want = true;
      break;
    }
  }
  if(want && (G.onGround||G.coyote>0)){ IN.jumpBuf = P.buffer; G.autoJ = 0.34; }
  G.autoJ = Math.max(0, (G.autoJ||0) - dt);
  IN.jumpHeld = G.autoJ > 0;
}
function stepAttract(dt){
  autoPilot(dt);
  stepPlay(dt);                                  // 判定は state が PLAY のときだけ働く
  if(G.px > 96 || G.py < G.lastY - 10){          // 導入部だけを繰り返す
    G.px = 4; G.py = 0; G.vy = 0; G.lastY = 0; G.speed = speedAt(world, 0);
    G.onGround = true; G.airT = 0;
    for(const h of world.hazards) h._clr = null;
  }
}

/* ------------------------------------------------------- 見た目更新 */
function updateRider(dt){
  const u = rider.userData;
  rider.position.set(G.px, G.py, 0);
  if(G.state==='DEAD'){
    rider.rotation.z += 9*dt; rider.rotation.y = 0;
  }else{
    const wantY = IN.brake && G.state==='PLAY' ? Math.PI*0.94 : 0;
    G.faceY += (wantY-G.faceY)*Math.min(1, dt*11);
    rider.rotation.y = G.faceY;
    let rz = G.onGround ? Math.atan(G.groundSlope) : clamp(-G.vy*0.018, -0.34, 0.24);
    if(IN.brake && G.state==='PLAY') rz += 0.16;
    if(G.crouching) rz -= 0.10;
    rider.rotation.z += (rz-rider.rotation.z)*Math.min(1, dt*12);
  }
  const c = G.crouching ? 1 : 0;
  const cu = u._c = lerp(u._c||0, c, Math.min(1, dt*18));
  /* 着地の沈み込み（ばね） */
  if(G.landImpact > 0){ u._sqv = (u._sqv||0) - G.landImpact*9; G.landImpact = 0; }
  u._sq = u._sq||0; u._sqv = u._sqv||0;
  u._sqv += (-u._sq*260 - u._sqv*16)*dt; u._sq += u._sqv*dt;
  const sq = clamp(-u._sq, 0, 0.5);
  /* 空中では脚をたたむ */
  const air = u._air = lerp(u._air||0, G.onGround ? 0 : clamp(G.airT*4, 0, 1), Math.min(1, dt*10));
  const sk2 = clamp((G.speed-10)/14, 0, 1);
  const bob = G.onGround && G.state==='PLAY' ? Math.sin(G.t*31)*0.018*sk2 : 0;
  u.gLegs.scale.y = (1 - 0.46*cu) * (1 - 0.24*air) * (1 - sq*0.8);
  u.gTorso.position.y = 0.96 - 0.44*cu - 0.20*air - 0.55*sq + bob;
  u.gTorso.rotation.z = -(0.20 + 0.60*cu) + 0.18*air;
  u.gHead.position.y = 1.62 - 0.60*cu - 0.20*air - 0.55*sq + bob;
  u.gHead.position.x = 0.11 + 0.30*cu;
  u.gHead.rotation.z = -0.20*cu;
  /* 宙返り：体の中心（足元から 1m）を軸に回す */
  if(G.flip >= 0 && !G.onGround){
    G.flip += dt;
    const p = clamp(G.flip/G.flipDur, 0, 1), e = p*p*(3-2*p), a = e*Math.PI*2;
    rider.rotation.z = a;
    rider.position.set(G.px + Math.sin(a)*1.0, G.py + 1.0 - Math.cos(a)*1.0, 0);
    if(p >= 1) flipDone();
  }
  /* 噴射 */
  const sk = clamp((G.speed-7)/11, 0, 1);
  const fl = 0.7 + sk*1.5 + Math.sin(G.t*40)*0.14;
  const brk = IN.brake && G.state==='PLAY';
  u.flame.scale.set(fl*(brk?1.5:1), 1+sk*0.3, 1+sk*0.3);
  u.flame2.scale.set(fl*0.8, 1, 1);
  u.flame.material.opacity = (G.state==='DEAD'?0:0.55+sk*0.4);
  u.flame2.material.opacity = (G.state==='DEAD'?0:0.5+sk*0.4);
  u.flame.material.color.setHex(brk ? 0xffb45a : 0x8fe6ff);
  /* 無敵中の点滅 */
  rider.visible = !(G.invuln>0 && Math.floor(G.t*20)%2===0);
  /* 影 */
  const gy = groundYAt(G.px, G.py+0.1);
  if(gy!==null && G.py-gy < 12){
    shadowMesh.visible = true;
    shadowMesh.position.set(G.px, gy+0.06, 0);
    const air = clamp(1-(G.py-gy)/7, 0.22, 1);
    shadowMesh.scale.set(1.25*air, 0.62*air, 1);
    shadowMesh.material.opacity = 0.32*air;
  } else shadowMesh.visible = false;
  /* 雪煙 */
  if(G.onGround && (G.state==='PLAY'||G.state==='TITLE'||G.state==='CLEAR')){
    const n = brk ? 5 : (G.iceOn ? 1 : 2);
    emitSpray(G.px-1.1, G.py+0.05, 0, n, brk?7:2.4+sk*3, brk?3.4:1.6);
  }
}
function updateParticles(dt, camX, camY){
  fxScale.value = renderer.getDrawingBufferSize(_dbs).y * 0.5 / Math.tan(camera.fov*Math.PI/360);
  emitTrails(dt);
  updateSnow(dt, camX, camY);
  puffs.update(dt);
  glows.update(dt);
  /* 脱げた服 */
  for(const d of debris){
    if(d.life<=0){ if(d.m.visible) d.m.visible=false; continue; }
    d.life -= dt; d.vy -= 26*dt;
    d.m.position.x += d.vx*dt; d.m.position.y += d.vy*dt; d.m.position.z += d.vz*dt;
    d.m.rotation.x += d.rx*dt; d.m.rotation.y += d.ry*dt;
    if(d.m.position.y < -6) d.life = 0;
  }
}
function updateItems(dt){
  let n = 0;
  for(const it of world.items){
    if(it.type==='coin'){
      const vis = !it.got && it.x > G.px-14 && it.x < G.px+58;
      if(vis){
        _m4.position.set(it.x, it.y + Math.sin(G.t*2.4+it.x)*0.12, 0);
        _m4.rotation.set(0, G.t*2.6 + it.x, 0.2);
        _m4.scale.set(1,1,1);
      }else{ _m4.position.set(0,-999,0); _m4.scale.set(0.0001,0.0001,0.0001); _m4.rotation.set(0,0,0); }
      _m4.updateMatrix();
      coinMesh.setMatrixAt(it.slot, _m4.matrix);
      n++;
    }else if(it.mesh){
      it.mesh.visible = !it.got && Math.abs(it.x-G.px)<60;
      it.mesh.rotation.y = G.t*1.8;
      it.mesh.position.y = it.y + Math.sin(G.t*2)*0.18;
    }
  }
  if(n) coinMesh.instanceMatrix.needsUpdate = true;
}
function updateEnemies(dt){
  for(const e of world.enemies){
    const near = e.x > G.px-30 && e.x < G.px+80;
    if(near && !e.mesh){
      e.mesh = new THREE.Mesh(ENEMY_GEO[e.kind], propMat); e.mesh.castShadow = true; scene.add(e.mesh);
    }else if(!near && e.mesh){ scene.remove(e.mesh); e.mesh=null; }
    if(!e.mesh) continue;
    const d = ENEMY_DEF[e.kind];
    const gy = terrainY(e.x);
    if(gy!==null) e.y = gy + e.dy;                 // 坂の上でも地面に乗る
    if(e.kind==='flyer'){
      e.mesh.position.set(e.x, e.y + Math.sin(G.t*3+e.ph)*0.22 + 0.45, 0);
      e.mesh.rotation.z = Math.sin(G.t*3+e.ph)*0.16;
      e.mesh.rotation.y = 0;
    }else{
      e.mesh.position.set(e.x, e.y + Math.abs(Math.sin(G.t*6+e.ph))*0.16, 0);
      e.mesh.rotation.z = Math.sin(G.t*6+e.ph)*0.10;
    }
  }
}
let hudTick = 0;
(function placeMarks(){
  const put = (id, x) => { const e = el(id); if(e && x) e.style.left = clamp(x/world.goalX, 0, 1)*100 + '%'; };
  put('markRail', world.marks.w5_rail);
  put('markGate', world.gates.length ? world.gates[0].x : 0);
})();
function updateHUD(){
  const p = clamp(G.px/world.goalX, 0, 1)*100;
  UI.bar.style.width = p+'%';
  UI.barIcon.style.left = p+'%';
  UI.coin.textContent = G.coins;
  if((hudTick++ & 3)===0){
    UI.spd.textContent = Math.round(G.speed*7.5);
    UI.spdBox.classList.toggle('hot', G.boost > 1.2);
  }
}

/* ============================================================= カメラ */
function updateCamera(dt){
  const sk = clamp((G.speed-9)/12, 0, 1);            // 体感速度の強さ
  camera.fov += (lerp(P.fov, P.fovFast, sk) - camera.fov)*Math.min(1, dt*2.5);
  camera.updateProjectionMatrix();
  G.camAir += ((G.onGround ? 0 : clamp(G.airT-0.25, 0, 0.9)) - G.camAir) * Math.min(1, dt*2.6);
  const intro = G.introT > 0 ? ease(G.introT/(G.introMax||1)) : 0;
  const halfW = (lerp(P.viewW, P.viewWFast, sk) + G.camAir*7 + intro*14)/2;
  const dist = halfW/(Math.tan(camera.fov*Math.PI/360)*camera.aspect);
  /* 先の地形を見てカメラを構える（落ちる前に落ちる先が見える） */
  const ya = terrainY(G.px + 20);
  const base = ya===null ? G.py : lerp(G.py, Math.max(ya, G.py-7), 0.45);
  const targetY = base + 4.5;
  G.camY += (targetY-G.camY)*Math.min(1, dt*4.2);
  G.camDip *= Math.exp(-9*dt);
  let sx=0, sy=0;
  if(G.shake>0){ G.shake = Math.max(0, G.shake-dt*1.9);
    sx=(Math.random()-0.5)*G.shake*1.6; sy=(Math.random()-0.5)*G.shake*1.6; }
  const rush = sk*sk*0.10;                            // 最高速域の微振動
  sx += (Math.random()-0.5)*rush; sy += (Math.random()-0.5)*rush;
  const cx = G.px + P.camLead;
  camera.position.set(cx+sx - intro*6, G.camY - G.camDip + sy + intro*5, dist);
  camera.lookAt(cx+sx, G.camY-1.05+sy, 0);
  /* 下り坂では画面をわずかに傾けて、坂を実際より急に見せる */
  G.camRoll += ((G.onGround ? -Math.atan(G.groundSlope)*0.16 : 0) - G.camRoll) * Math.min(1, dt*2.2);
  camera.rotateZ(G.camRoll);
  updateFar(cx, G.camY);
  recycleForeground(cx, G.camY, sk);
  return cx;
}

/* =============================================================== ループ */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now-last)/1000; last = now;
  const rawDt = dt;
  if(dt > 0.05) dt = 0.05;
  if(G.hitStop > 0){ G.hitStop -= rawDt; dt = 0; }
  else if(G.slowT > 0){ G.slowT -= rawDt; dt *= G.slowK; }
  pollPad();
  G.t += dt;

  switch(G.state){
    case 'TITLE':
      stepAttract(dt);
      if(IN.anyPress) startGame();
      break;
    case 'PLAY':
      if(!G.paused) stepPlay(dt);
      break;
    case 'DEAD':{
      G.deadT += dt;
      G.speed = Math.max(0, G.speed - 9*dt);
      G.px += G.speed*dt;
      G.vy -= P.gravity*dt; G.py += G.vy*dt;
      const gy = groundYAt(G.px, G.py+0.4);
      if(gy!==null && G.py<gy){ G.py=gy; G.vy = Math.abs(G.vy)*0.32; }
      if(G.deadT > 1.25){ G.state='RESULT'; showResult(false); }
      break; }
    case 'CLEAR':{
      G.clearT += dt;
      G.speed += (2.5-G.speed)*Math.min(1, dt*1.6);
      G.px += G.speed*dt;
      const gy2 = groundYAt(G.px, G.py+0.4);
      if(gy2!==null){ G.py = gy2; G.onGround=true; }
      G.crouching = false;
      if(G.clearT > 1.8){ G.state='RESULT'; showResult(true); }
      break; }
    case 'RESULT':
      G.resultT = (G.resultT||0) + dt;
      G.speed = Math.max(0, G.speed - 6*dt);
      if(G.resultT > 0.75 && IN.anyPress) startGame();
      break;
  }

  /* ヒント表示とニアミス表示の減衰 */
  if(G.hintT>0){ G.hintT -= dt; if(G.hintT<=0) UI.hint.classList.remove('show'); }
  if(G.popT>0){ G.popT -= dt; UI.pop.style.opacity = Math.max(0, Math.min(1, G.popT*2.2)); }

  const camX = updateCamera(dt);
  sampleAtmos(G.px / world.length);
  applyAtmos(dt, camX, G.camY);
  updateRider(dt);
  if(G.state==='PLAY') recordGhost();
  updateGhost();
  if(G.introT > 0) G.introT = Math.max(0, G.introT - dt);
  if(G.splitT > 0){ G.splitT -= dt; if(G.splitT <= 0) UI.split.style.opacity = 0; }
  updateEnemies(dt);
  updateItems(dt);
  updateParticles(dt, camX, G.camY);
  if(G.state==='PLAY' && !G.paused){
    updateHUD();
    Sound.speed(G.speed, IN.brake, G.boost);
    const pr = G.px/world.length;
    Sound.update(G.rush ? 'storm' : (pr > 0.715 ? 'rise' : (pr > 0.60 ? 'calm' : 'main')));
  }else if(G.state==='TITLE'){
    Sound.speed(6, false);
  }
  IN.anyPress = false;
  updatePostFx(dt);
  renderFrame();
  adaptQuality(rawDt);
}
/* 速度・勢い・被弾をポスト処理の強さに変換する */
const _pv = new THREE.Vector3();
function updatePostFx(dt){
  const sk = clamp((G.speed-15)/10, 0, 1);
  const play = G.state==='PLAY' || G.state==='CLEAR';
  PF.radial += ((play ? sk*sk*0.045 + Math.max(0,G.boost-2)*0.004 : 0) - PF.radial) * Math.min(1, dt*4);
  PF.ca     += ((play ? Math.max(0, G.boost-1.5)*0.010 : 0) - PF.ca) * Math.min(1, dt*4);
  const hurtT = G.hitT > 0 ? G.hitT/P.hitTime : 0;
  PF.hurt   = Math.max(hurtT*0.9, G.clothes ? 0 : 0.10 + 0.06*Math.sin(G.t*6));
  if(G.state!=='PLAY') PF.hurt *= 0.5;
  _pv.set(G.px, G.py + 1.0, 0).project(camera);
  compMat.uniforms.uFocus.value.set(_pv.x*0.5+0.5, _pv.y*0.5+0.5);
}
/* 重ければ1段ずつ下げる（手動で決めたら触らない） */
const perf = { acc:0, n:0, t:0 };
function adaptQuality(rawDt){
  if(!qAuto || G.state!=='PLAY' || G.paused || document.hidden) { perf.acc=0; perf.n=0; perf.t=0; return; }
  perf.acc += rawDt; perf.n++; perf.t += rawDt;
  if(perf.t > 2.0){
    const avg = perf.acc/perf.n;
    if(avg > 0.026 && qIdx > 0) setQuality(qIdx-1, false);
    perf.acc=0; perf.n=0; perf.t=0;
  }
}

/* ================================================== リサイズ・画面向き */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, Q().pr));
  renderer.setSize(w, h);
  sizePost();
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  const portrait = h > w*1.05;
  const need = isTouch && portrait;
  el('orient').classList.toggle('show', need);
  if(need && G.state==='PLAY' && !G.paused) togglePause();
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=> setTimeout(resize, 150));

/* ================================================================ 起動 */
resize();
toTitle();
precompile();
requestAnimationFrame(frame);
window.JBR = {G, IN, world, P, CLIMATES, Store, compile, CHUNKS, STAGES, speedAt, inIce, renderer, scene, camera, Sound,
              sun, setQuality, QUALITY, AT, PF}; // 調整・検証用
</script>
