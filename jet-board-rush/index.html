<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JET BOARD RUSH</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#07101d;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;
    color:#eaf4ff;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
    touch-action:none;overscroll-behavior:none;
  }
  #view{position:fixed;inset:0;}
  #view canvas{display:block;}

  /* ---- HUD : 画面の説明は最小限。距離バーとコイン数だけ ---- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;
       padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));}
  #hud.off{opacity:0;}
  #bar{position:relative;height:6px;border-radius:3px;background:rgba(10,28,48,.55);
       box-shadow:0 1px 0 rgba(255,255,255,.12) inset;overflow:visible;}
  #barFill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:3px;
           background:linear-gradient(90deg,#5fd0ff,#bff0ff);box-shadow:0 0 10px rgba(120,220,255,.7);}
  #barIcon{position:absolute;top:-9px;left:0;width:22px;height:22px;margin-left:-11px;
           transform:translateX(0);font-size:16px;line-height:22px;text-align:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
  #barGoal{position:absolute;right:-4px;top:-10px;font-size:15px;opacity:.85;}
  #stats{display:flex;justify-content:space-between;align-items:flex-start;margin-top:9px;
         font-weight:800;letter-spacing:.08em;text-shadow:0 2px 6px rgba(0,20,40,.75);}
  #coins{font-size:clamp(15px,3.4vh,22px);color:#ffe9a8;}
  #coins small{font-size:.62em;opacity:.75;margin-right:.25em;color:#fff;}
  #spd{font-size:clamp(12px,2.6vh,17px);color:#a8dcff;opacity:.9;text-align:right;}
  #spd b{font-size:1.35em;color:#eaffff;transition:color .2s,text-shadow .2s;}
  #spd.hot b{color:#ffe37a;text-shadow:0 0 14px rgba(255,200,60,.9);}
  #spd.hot{color:#ffd166;}

  /* ---- 中央ヒント（アイコンだけ。文字は最小限） ---- */
  #coins.bump{animation:bump .28s ease-out;}
  @keyframes bump{0%{transform:scale(1.45)}100%{transform:scale(1)}}
  #coins{transform-origin:left center;display:inline-block;}
  #pop.trick{color:#ffe07a;text-shadow:0 0 18px rgba(255,190,60,.95),0 2px 6px rgba(40,20,0,.7);}
  #pop{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:13;pointer-events:none;
       font-weight:900;font-size:clamp(16px,3.6vh,26px);letter-spacing:.12em;color:#9ff0ff;opacity:0;
       text-shadow:0 0 16px rgba(120,230,255,.9),0 2px 6px rgba(0,20,40,.7);}
  #hint{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:12;
        pointer-events:none;opacity:0;transition:opacity .28s;text-align:center;}
  #hint .glyph{font-size:clamp(46px,13vh,96px);line-height:1;font-weight:900;color:#fff;
        text-shadow:0 0 26px rgba(120,220,255,.95),0 4px 10px rgba(0,0,0,.6);}
  #hint .cap{margin-top:6px;font-size:clamp(11px,2.2vh,15px);letter-spacing:.32em;color:#bfe7ff;opacity:.9;}
  #hint.show{opacity:1;}

  /* ---- 全画面オーバーレイ ---- */
  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
          align-items:center;justify-content:center;text-align:center;padding:20px;
          background:radial-gradient(ellipse at 50% 38%,rgba(18,44,78,.72) 0%,rgba(5,12,24,.9) 68%,rgba(2,6,12,.96) 100%);
          backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
  .screen.hidden{display:none;}
  /* タイトルは後ろの自動運転デモと空が見えるように薄く */
  #title{background:radial-gradient(ellipse at 50% 42%,rgba(8,20,40,.50) 0%,rgba(4,10,22,.38) 55%,rgba(2,6,12,.72) 100%);
         backdrop-filter:none;-webkit-backdrop-filter:none;}
  .logo{font-weight:900;letter-spacing:.06em;line-height:.94;
        font-size:clamp(34px,11.5vh,86px);
        background:linear-gradient(180deg,#ffffff 0%,#bfeaff 46%,#4fb8ff 78%,#2b7fd6 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent;
        filter:drop-shadow(0 4px 0 rgba(10,40,80,.55)) drop-shadow(0 0 26px rgba(90,200,255,.45));}
  .logo em{display:block;font-style:normal;font-size:.42em;letter-spacing:.42em;
           background:none;-webkit-text-fill-color:#9fd9ff;color:#9fd9ff;margin-top:.5em;opacity:.95;}
  .keyrow{display:flex;gap:clamp(10px,3vw,26px);margin-top:clamp(14px,4vh,34px);flex-wrap:wrap;justify-content:center;}
  .key{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:64px;}
  .key .k{width:clamp(34px,7vh,46px);height:clamp(34px,7vh,46px);border-radius:10px;
          border:2px solid rgba(150,215,255,.55);background:rgba(14,38,68,.6);
          display:flex;align-items:center;justify-content:center;font-size:clamp(17px,3.4vh,24px);
          font-weight:900;color:#eaf7ff;box-shadow:0 3px 0 rgba(30,80,140,.5),0 0 18px rgba(80,180,255,.18) inset;}
  .key .t{font-size:clamp(10px,1.9vh,12px);letter-spacing:.16em;color:#8fc4ee;}
  .prompt{margin-top:clamp(16px,4.5vh,36px);font-size:clamp(13px,2.6vh,18px);letter-spacing:.34em;
          color:#fff;animation:blink 1.15s infinite;font-weight:800;}
  @keyframes blink{0%,58%{opacity:1}59%,100%{opacity:.18}}
  .best{margin-top:14px;font-size:clamp(11px,2vh,14px);letter-spacing:.2em;color:#8ab8dd;}

  #resultTitle{font-weight:900;letter-spacing:.14em;font-size:clamp(30px,9.5vh,68px);}
  #resultTitle.clear{background:linear-gradient(180deg,#fff 0%,#ffe9a0 55%,#ffb020 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent;
        filter:drop-shadow(0 3px 0 rgba(120,60,0,.4));}
  #resultTitle.fail{color:#ff9c9c;text-shadow:0 0 24px rgba(255,60,60,.4);}
  #resultSub{margin-top:6px;font-size:clamp(11px,2.2vh,15px);letter-spacing:.28em;color:#9dc6e8;}
  .sheet{margin-top:clamp(12px,3vh,24px);display:grid;grid-template-columns:auto auto;
         gap:4px clamp(16px,5vw,40px);font-size:clamp(12px,2.4vh,17px);}
  .sheet div{padding:2px 0;}
  .sheet .l{text-align:right;color:#8fbede;letter-spacing:.16em;}
  .sheet .v{text-align:left;font-weight:800;color:#eaf7ff;}
  .sheet .v b{color:#ffe08a;}
  .total{margin-top:10px;font-size:clamp(18px,4.4vh,32px);font-weight:900;letter-spacing:.1em;color:#fff;}
  .total span{font-size:.55em;letter-spacing:.3em;color:#8fbede;margin-right:.6em;}
  .newbest{margin-top:6px;font-size:clamp(11px,2.2vh,15px);letter-spacing:.3em;color:#ffd166;animation:blink 1s infinite;}

  /* 距離バーの目印（落ち着き区間・最終ゲート）とゴーストの位置 */
  #bar .mark{position:absolute;top:-3px;width:2px;height:12px;background:rgba(255,215,140,.75);border-radius:1px;}
  #bar .mark.gate{background:#9ff0ff;width:3px;box-shadow:0 0 8px rgba(120,230,255,.9);}
  #barGhost{position:absolute;top:-2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;
            background:rgba(140,230,255,.55);box-shadow:0 0 8px rgba(140,230,255,.8);display:none;}
  /* 区間タイム（ゲート通過時にベストと比べる） */
  #split{position:fixed;left:50%;top:24%;transform:translateX(-50%);z-index:13;pointer-events:none;opacity:0;
         font-weight:900;font-size:clamp(18px,4.4vh,34px);letter-spacing:.08em;transition:opacity .3s;
         text-shadow:0 2px 10px rgba(0,0,0,.55);}
  #split.fast{color:#7dffb0;} #split.slow{color:#ff8c8c;}
  #split small{display:block;font-size:.42em;letter-spacing:.35em;color:#dfeeff;opacity:.85;text-align:center;}
  /* スタートの GO! */
  #go{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);z-index:13;pointer-events:none;
      opacity:0;font-weight:900;font-size:clamp(48px,15vh,120px);letter-spacing:.08em;font-style:italic;
      background:linear-gradient(180deg,#fff 0%,#ffe9a0 55%,#ffb020 100%);-webkit-background-clip:text;
      background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(120,60,0,.45)) drop-shadow(0 0 30px rgba(255,190,80,.6));}
  #go.show{animation:go 0.9s ease-out forwards;}
  @keyframes go{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}
                70%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
  /* リザルト：ランクの判子と、行の順番表示 */
  .rtop{display:flex;align-items:center;gap:clamp(14px,3vw,30px);}
  #rank{font-weight:900;font-size:clamp(56px,17vh,130px);line-height:1;font-style:italic;
        width:1.15em;text-align:center;opacity:0;transform:scale(2.4) rotate(-14deg);}
  #rank.stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-16deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
  #rank.S{color:#ffe07a;text-shadow:0 0 30px rgba(255,200,60,.9),0 4px 0 #8a5a00;}
  #rank.A{color:#9ff0ff;text-shadow:0 0 26px rgba(100,220,255,.8),0 4px 0 #1a4a70;}
  #rank.B{color:#b8ffb0;text-shadow:0 0 20px rgba(120,255,140,.6),0 4px 0 #1a5a2a;}
  #rank.C{color:#e0e0f0;text-shadow:0 4px 0 #3a3a55;}
  #rank.D{color:#c09090;text-shadow:0 4px 0 #402424;}
  .sheet div{opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;}
  .sheet div.in{opacity:1;transform:none;}
  #delta{margin-top:4px;font-size:clamp(12px,2.4vh,16px);letter-spacing:.2em;font-weight:800;min-height:1.2em;}
  #delta.fast{color:#7dffb0;} #delta.slow{color:#ff9c9c;}
  #pauseNote small{display:block;margin-top:12px;font-size:12px;letter-spacing:.25em;color:#9fc4e8;font-weight:600;}
  #pauseNote{flex-direction:column;}
  #orient{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;
          justify-content:center;background:#050c16;text-align:center;gap:18px;}
  #orient.show{display:flex;}
  #orient .ph{width:64px;height:104px;border:3px solid #7fc4f0;border-radius:12px;
              animation:rot 1.8s ease-in-out infinite;}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  #orient p{letter-spacing:.24em;font-size:14px;color:#a9d4f2;}

  #flash{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:#fff;}
  #vig{position:fixed;inset:0;z-index:8;pointer-events:none;
       background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 52%,rgba(3,10,20,.55) 100%);}

  #sound{position:fixed;z-index:14;right:calc(10px + env(safe-area-inset-right));
         bottom:calc(10px + env(safe-area-inset-bottom));width:34px;height:34px;border-radius:50%;
         border:1px solid rgba(150,215,255,.3);background:rgba(8,22,40,.45);color:#bfe3ff;
         font-size:15px;line-height:32px;text-align:center;cursor:pointer;opacity:.5;}
  #sound:hover{opacity:1;}

  #qnote{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));
         z-index:14;font-size:11px;letter-spacing:.2em;color:#cfe8ff;opacity:0;transition:opacity .4s;
         pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6);}
  #pauseNote{position:fixed;inset:0;z-index:22;display:none;align-items:center;justify-content:center;
             background:rgba(4,10,20,.72);letter-spacing:.4em;font-weight:800;font-size:clamp(16px,4vh,28px);}
  #pauseNote.show{display:flex;}
</style>
</head>
<body>
<div id="view"></div>
<div id="vig"></div>
<div id="flash"></div>

<div id="hud" class="off">
  <div id="bar"><div id="barFill"></div><div class="mark" id="markRail"></div><div class="mark gate" id="markGate"></div>
    <div id="barGhost"></div><div id="barIcon">🏂</div><div id="barGoal">🚩</div></div>
  <div id="stats">
    <div id="coins"><small>❄</small><span id="coinNum">0</span></div>
    <div id="spd"><b id="spdNum">0</b> km/h</div>
  </div>
</div>

<div id="pop"></div>
<div id="split"></div>
<div id="go">GO!</div>
<div id="hint"><div class="glyph" id="hintGlyph">▲</div><div class="cap" id="hintCap"></div></div>

<div id="title" class="screen">
  <div class="logo">JET BOARD<br>RUSH<em>FROST RIDGE</em></div>
  <div class="keyrow" id="keyrow"></div>
  <div class="prompt" id="startPrompt">CLICK TO START</div>
  <div class="best" id="titleBest"></div>
</div>

<div id="result" class="screen hidden">
  <div class="rtop"><div id="rank">S</div><div>
    <div id="resultTitle">CLEAR</div>
    <div id="resultSub"></div></div></div>
  <div class="sheet" id="sheet"></div>
  <div class="total"><span>SCORE</span><span id="totalNum">0</span></div>
  <div id="delta"></div>
  <div class="newbest hidden" id="newbest">NEW RECORD</div>
  <div class="prompt" id="retryPrompt">CLICK TO RETRY</div>
  <div class="best" id="resultBest"></div>
</div>

<div id="orient"><div class="ph"></div><p>横向きにしてください</p></div>
<div id="pauseNote" class="show" style="display:none">PAUSE<small>ESC で再開 ／ R でやり直し</small></div>
<div id="sound">♪</div>
<div id="qnote"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
if(!window.THREE){
  document.getElementById('title').innerHTML =
    '<div class="logo">JET BOARD<br>RUSH</div>' +
    '<div class="best" style="margin-top:24px;line-height:2">three.js を読み込めませんでした（CDN 到達不可）。<br>' +
    'オフラインで遊ぶときは build-itch.sh で書き出した版を使ってください。</div>';
  throw new Error('three.js is not available');
}
/* =========================================================================
   JET BOARD RUSH — 冬ステージ プロトタイプ
   ・オートスクロール横スクロールアクション。操作は「跳ぶ／伏せる／減速」だけ
   ・気候(climate)でパレットと地形の見た目を差し替えられる構造にしてある
   ・ステージは CHUNKS（部品）を並べた STAGES データから展開する
   ========================================================================= */

/* ---------------------------------------------------------------- 小道具 */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const ease  = t=> t*t*(3-2*t);
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

/* ============================================================== 気候定義
   プロトタイプで使うのは winter だけ。summer は「差し替えられる」ことを
   示すための同構造データで、CLIMATE_ID を変えるだけで通しで遊べる。      */
const CLIMATES = {
  winter:{
    id:'winter', label:'FROST RIDGE',
    sky:[0x9fd8f5,0x2f6ea8],              // 地平線側／天頂側
    fog:{color:0xa9d8f2, near:70, far:300},
    light:{sun:0xfff3dc, sunI:1.05, sky:0xbfe4ff, ground:0x6f93b8, ambI:0.85,
           dir:[-0.45,1.0,0.75]},
    ground:{top:0xf8fdff, top2:0xd2e6f8, side:0x8fb6d8, deep:0x46688c, lip:0xffffff},
    ice   :{top:0x7fd0f2, side:0x3f8cc0, spec:0xe8fbff},
    block :{main:0x8ed8f8, edge:0x4fa8dc, tip:0xffffff, shape:'icicle'},
    arch  :{main:0x9fdcf8, edge:0x4f97c8},
    tree  :{trunk:0x5a4130, leaf:0x1e5a44, leaf2:0x276b52, snow:0xffffff, shape:'pine'},
    rock  :{main:0x8fa8bd, snow:0xffffff},
    far   :{near:0xa9cfe8, mid:0x86b2d4, deep:0x6d97bd},
    dust  :{color:0xffffff, size:0.16, n:420, mode:'snow'},
    spray :0xffffff,
    goal  :{post:0x2f5f8c, flag:0xff5a5a},
    music :{root:220.0, scale:[0,2,3,5,7,8,10], tempo:132}
  },
  /* --- 将来拡張の見本（プロトタイプ対象外・データだけ用意） --- */
  summer:{
    id:'summer', label:'BLAZE COAST',
    sky:[0xffd9a0,0x1f8fd0],
    fog:{color:0xffd9a8, near:75, far:310},
    light:{sun:0xfff0c8, sunI:1.2, sky:0xffe6bd, ground:0xb08050, ambI:0.8, dir:[-0.4,1.0,0.6]},
    ground:{top:0xf6e3a8, top2:0xe8cf8c, side:0xc9a468, deep:0x8a6c3e, lip:0xfff3cf},
    ice   :{top:0x5fd8e8, side:0x2f9fc0, spec:0xd8fbff},   // 夏では「濡れた路面」
    block :{main:0x9a8570, edge:0x6f5c4a, tip:0xd8c8a8, shape:'rock'},
    arch  :{main:0x8a7358, edge:0x5f4c38},
    tree  :{trunk:0x7a5a38, leaf:0x2f9a4a, leaf2:0x49b45f, snow:0xffe08a, shape:'palm'},
    rock  :{main:0xa89070, snow:0xf0dfa8},
    far   :{near:0xf0c890, mid:0xd8a86a, deep:0xb98a52},
    dust  :{color:0xfff2c0, size:0.14, n:280, mode:'heat'},
    spray :0xfff0c8,
    goal  :{post:0x8a5a2f, flag:0x2fd0a0},
    music :{root:246.94, scale:[0,2,4,7,9], tempo:146}
  }
};
const CLIMATE_ID = 'winter';
const CL = CLIMATES[CLIMATE_ID];

/* ================================================== 物理・進行パラメータ
   速度は「進行度 0..1 の折れ線」で持つ。あとで数字だけ触れば調整できる。 */
const P = {
  gravity   : 34,
  jumpV     : 13.5,
  cutJump   : 0.42,     // ボタンを離したときの上昇打ち切り
  coyote    : 0.10,
  buffer    : 0.13,
  standH    : 2.0,
  crouchH   : 1.10,
  bodyW     : 1.10,
  brakeMul  : 0.62,     // 後ろ向き減速
  iceMul    : 1.08,     // 氷上は滑って少し速い
  iceBrake  : 0.42,     // 氷上でのブレーキの効き（0..1）
  hitMul    : 0.72,     // 被弾直後の失速
  hitTime   : 0.55,
  invuln    : 1.5,
  fallDrop  : 12,     // 直前の接地面からこれだけ落ちたらミス
  camLead   : 8.2,
  viewW     : 33,      // 画面に映るコースの横幅(m)。速度で少し広がる
  viewWFast : 38,
  fov       : 34,
  fovFast   : 41,
  slopeGain : 1.1,     // 坂にいる「あいだ」だけ効く倍率
  slopeMin  : 0.80,    // 上りでの下限
  slopeMax  : 1.30,    // 下りでの上限
  /* --- 勢い：坂で稼いだぶんは平地でもほとんど減らない --- */
  boostGain : 4.5,     // 坂で貯まる速さ
  boostDecay: 0.30,    // 平地での自然減衰（毎秒 m/s）
  boostBrake: 3.2,     // ブレーキ中の追加減衰。減速は稼いだ勢いを捨てる行為
  boostHit  : 2.5,     // 被弾で失う量
  boostMax  : 7.0,
  boostMin  : -2.0,
  speedCap  : 27,
  nearMiss  : 0.62,    // これ以内をかすめたらニアミス
  nearPts   : 40
};

/* ======================================================= ステージ部品集
   ent の x は部品内の相対座標。gaps は穴 [開始x, 幅]。
   t: block(柱/氷塊) low(くぐる) plat(足場) enemy coin coins wear ice hint sign
   これを並べ替えるだけでコースを量産できる。                            */
const CHUNKS = {
  /* ---- 導入 8秒。3つの操作を1回ずつ、間延びさせずに教える ---- */
  teach: {len:84, terrain:[[54,0],['gap',5],[25,0]], ents:[
    {t:'hint',x:4,icon:'jump'},  {t:'block',x:18,h:1.5,w:1.4},

const STAGES = [{
  id:'winter-01', climate:'winter', name:'FROST RIDGE',
  /* 進行度(0..1) → 速度(m/s)。坂はこのカーブに一時的な倍率として乗る */
  speed:[[0,13.0],[0.12,14.3],[0.30,15.8],[0.50,16.6],[0.68,17.0],[0.80,17.4],[0.87,19.2],[1,20.2]],
  seq:['teach','w1_drop','w2_duck','w3_ice','w4_launch','w5_rail','storm','goal']
}];

/* ステージ展開：部品を並べて絶対座標のワールドデータにする */
function compile(stage){
  const W = { id:stage.id, name:stage.name, climate:stage.climate, speed:stage.speed,
              length:0, surfaces:[], hazards:[], items:[], enemies:[], ices:[],
              hints:[], signs:[], gates:[], goalX:0, endY:0, marks:{} };
  let ox = 0, oy = 0;                       // 部品の開始位置と、その時点の地面の高さ
  for(const name of stage.seq){
    const c = CHUNKS[name];
    if(!c){ console.warn('unknown chunk', name); continue; }
    W.marks[name] = ox;
    /* --- 地形：[長さ, 高低差] と ['gap', 幅, 落差] の鎖として持つ --- */
    const terr = c.terrain || [[c.len, 0]];
    const segs = [];                        // この部品のローカル地形（当たり判定と配置の基準）
    let cx = 0, cy = oy;
    for(const t of terr){
      if(t[0]==='gap'){
        const w = t[1], dy = t[2]||0;
        segs.push({gap:true, x0:cx, x1:cx+w, y0:cy, y1:cy+dy});
        cx += w; cy += dy;
      }else{
        const len = t[0], dy = t[1]||0;
        const seg = {gap:false, x0:cx, x1:cx+len, y0:cy, y1:cy+dy};
        segs.push(seg);
        W.surfaces.push({x0:ox+seg.x0, x1:ox+seg.x1, y:seg.y0, y1:seg.y1, kind:'ground'});
        cx += len; cy += dy;
      }
    }
    if(Math.abs(cx - c.len) > 0.01) console.warn('terrain length mismatch in', name, cx, c.len);
    /* 部品内の任意の x における地面の高さ（穴の上は縁の高さを返す） */
    const gy = x => {
      for(const g of segs){
        if(x >= g.x0 && x <= g.x1) return lerp(g.y0, g.y1, (x-g.x0)/Math.max(1e-6,g.x1-g.x0));
      }
      return x < 0 ? oy : cy;
    };

    const gyTop = (x, w) => Math.max(gy(x-w/2), gy(x), gy(x+w/2));
    for(const e of (c.ents||[])){
      const x = ox + e.x, base = gy(e.x);
      switch(e.t){
        case 'block':{
          const w = e.w||1.5, h = e.h||1.6, b = gyTop(e.x, w*1.2);
          W.hazards.push({type:'block', x0:x-w/2, x1:x+w/2, y0:b, y1:b+h-0.22,
                          h:h, w:w, cx:x, base:b});
          W.surfaces.push({x0:x-w/2, x1:x+w/2, y:b+h, y1:b+h, kind:'block'});
          break; }
        case 'low':{
          const w = e.w||4, b = gyTop(e.x, w+1.2), y = b + (e.y||1.3);
          W.hazards.push({type:'low', x0:x-w/2, x1:x+w/2, y0:y, y1:y+3.6, w:w, cx:x, yb:y, base:b});
          break; }
        case 'plat':{
          const w = e.w||6, y = gyTop(e.x, w) + (e.y||0.6);
          W.surfaces.push({x0:x-w/2, x1:x+w/2, y:y, y1:y, kind:'plat'});
          break; }
        case 'ice': W.ices.push({x0:x, x1:x+(e.w||20)}); break;
        case 'enemy': W.enemies.push({kind:e.kind||'slider', x:x, y:base+(e.y||0),
                                      dy:e.y||0, alive:true, id:W.enemies.length}); break;
        case 'coin': W.items.push({type:'coin', x:x, y:base+(e.y||1.6), got:false}); break;
        case 'coins':{
          const n=e.n||4, dx=e.dx||2.6, arc=e.arc||0;
          for(let i=0;i<n;i++){
            const t = n>1 ? i/(n-1) : 0.5;
            W.items.push({type:'coin', x:x+i*dx, y:gy(e.x+i*dx)+(e.y||1.6)+(arc? Math.sin(t*Math.PI)*arc : 0), got:false});
          }
          break; }
        case 'wear': W.items.push({type:'wear', x:x, y:base+(e.y||2.0), got:false}); break;
        case 'hint': W.hints.push({x:x, icon:e.icon, fired:false}); break;
        case 'sign': W.signs.push({x:x, y:base}); break;
        case 'gate': W.gates.push({x:x, y:base, fired:false}); break;
        case 'goal': W.goalX = x; W.goalY = base; break;
      }
    }
    ox += c.len; oy = cy;
  }
  /* 部品の境目で地面が分割されたままにならないよう、傾きが同じ隣接面を結合する */
  const grounds = W.surfaces.filter(s=>s.kind==='ground').sort((a,b)=>a.x0-b.x0);
  const others  = W.surfaces.filter(s=>s.kind!=='ground');
  const merged = [];
  const slope = s => (s.y1-s.y)/(s.x1-s.x0);
  for(const s of grounds){
    const p = merged[merged.length-1];
    if(p && Math.abs(p.y1-s.y)<0.01 && Math.abs(slope(p)-slope(s))<0.001 && s.x0 <= p.x1+0.01){
      p.x1 = Math.max(p.x1, s.x1); p.y1 = s.y1;
    } else merged.push(s);
  }
  W.surfaces = merged.concat(others);
  W.length = ox; W.endY = oy;
  if(!W.goalX){ W.goalX = ox - 12; W.goalY = oy; }
  W.surfaces.sort((a,b)=>a.x0-b.x0);
  W.hazards.sort((a,b)=>a.x0-b.x0);
  W.items.sort((a,b)=>a.x-b.x);
  W.enemies.sort((a,b)=>a.x-b.x);
  return W;
}
/* 面の高さと傾き（水平面は y1 が y と同じ） */
function surfY(s, x){
  if(s.y1===s.y) return s.y;
  return s.y + (s.y1-s.y)*clamp((x-s.x0)/(s.x1-s.x0), 0, 1);
}
function surfSlope(s){ return s.y1===s.y ? 0 : (s.y1-s.y)/(s.x1-s.x0); }
function speedAt(world, p){
  const c = world.speed;
  p = clamp(p,0,1);
  for(let i=0;i<c.length-1;i++){
    if(p<=c[i+1][0]){
      const t=(p-c[i][0])/Math.max(1e-6,(c[i+1][0]-c[i][0]));
      return lerp(c[i][1], c[i+1][1], ease(clamp(t,0,1)));
    }
  }
  return c[c.length-1][1];
}

/* ================================================== ジオメトリビルダ
   面ごとに色を焼き込んで1メッシュにまとめる。テクスチャは使わない。 */
function GB(){ this.p=[]; this.n=[]; this.c=[]; }
GB.prototype._col = function(col, sh){
  const r=((col>>16)&255)/255*sh, g=((col>>8)&255)/255*sh, b=(col&255)/255*sh;
  return [r,g,b];
};
GB.prototype.tri = function(a,b,c,col,sh){
  const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2], vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
  let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
  const l=Math.hypot(nx,ny,nz)||1; nx/=l; ny/=l; nz/=l;
  const rgb=this._col(col, sh===undefined?1:sh);
  for(const v of [a,b,c]){ this.p.push(v[0],v[1],v[2]); this.n.push(nx,ny,nz); this.c.push(rgb[0],rgb[1],rgb[2]); }
  return this;
};
GB.prototype.quad = function(a,b,c,d,col,sh){ this.tri(a,b,c,col,sh); this.tri(a,c,d,col,sh); return this; };
/* 上面/側面/底面で色を変えられる箱 */
GB.prototype.box = function(cx,cy,cz,sx,sy,sz,col,o){
  o=o||{}; const top=o.top!==undefined?o.top:col, bot=o.bot!==undefined?o.bot:col;
  const x0=cx-sx/2,x1=cx+sx/2,y0=cy-sy/2,y1=cy+sy/2,z0=cz-sz/2,z1=cz+sz/2;
  const A=[x0,y1,z1],B=[x1,y1,z1],C=[x1,y1,z0],D=[x0,y1,z0];
  const E=[x0,y0,z1],F=[x1,y0,z1],G=[x1,y0,z0],H=[x0,y0,z0];
  this.quad(A,B,C,D,top,o.shTop||1.0);      // 上
  this.quad(H,G,F,E,bot,o.shBot||0.42);     // 下
  this.quad(E,F,B,A,col,o.shZ||0.86);       // 手前
  this.quad(G,H,D,C,col,o.shZb||0.6);       // 奥
  this.quad(H,E,A,D,col,o.shX||0.7);        // 左
  this.quad(F,G,C,B,col,o.shX||0.72);       // 右
  return this;
};
/* 上下でサイズの違う四角錐台（氷柱・岩・木の幹などに使う） */
GB.prototype.taper = function(cx,y0,cz,sx0,sz0,sx1,sz1,h,col,o){
  o=o||{}; const y1=y0+h, top=o.top!==undefined?o.top:col;
  const a0=[cx-sx0/2,y0,cz+sz0/2],b0=[cx+sx0/2,y0,cz+sz0/2],c0=[cx+sx0/2,y0,cz-sz0/2],d0=[cx-sx0/2,y0,cz-sz0/2];
  const a1=[cx-sx1/2,y1,cz+sz1/2],b1=[cx+sx1/2,y1,cz+sz1/2],c1=[cx+sx1/2,y1,cz-sz1/2],d1=[cx-sx1/2,y1,cz-sz1/2];
  this.quad(a0,b0,b1,a1,col,o.shZ||0.88);
  this.quad(c0,d0,d1,c1,col,o.shZb||0.58);
  this.quad(d0,a0,a1,d1,col,o.shX||0.7);
  this.quad(b0,c0,c1,b1,col,o.shX||0.74);
  if(sx1>0.001&&sz1>0.001) this.quad(a1,b1,c1,d1,top,o.shTop||1.0);
  if(!o.noBottom) this.quad(d0,c0,b0,a0,col,o.shBot||0.4);
  return this;
};
/* 上が尖った四角錐 */
GB.prototype.spike = function(cx,y0,cz,s,h,col,o){
  o=o||{}; const t=[cx,y0+h,cz];
  const a=[cx-s/2,y0,cz+s/2],b=[cx+s/2,y0,cz+s/2],c=[cx+s/2,y0,cz-s/2],d=[cx-s/2,y0,cz-s/2];
  this.tri(a,b,t,col,o.shZ||0.92); this.tri(b,c,t,col,o.shX||0.76);
  this.tri(c,d,t,col,o.shZb||0.6);  this.tri(d,a,t,col,o.shX||0.7);
  if(!o.noBottom) this.quad(d,c,b,a,col,0.4);
  return this;
};
/* 下向きの錐（つらら） */
GB.prototype.icicle = function(cx,yTop,cz,s,h,col){
  const t=[cx,yTop-h,cz];
  const a=[cx-s/2,yTop,cz+s/2],b=[cx+s/2,yTop,cz+s/2],c=[cx+s/2,yTop,cz-s/2],d=[cx-s/2,yTop,cz-s/2];
  this.tri(b,a,t,col,0.95); this.tri(c,b,t,col,0.8); this.tri(d,c,t,col,0.62); this.tri(a,d,t,col,0.72);
  return this;
};
GB.prototype.cyl = function(cx,y0,cz,r0,r1,h,seg,col,o){
  o=o||{}; const y1=y0+h;
  for(let i=0;i<seg;i++){
    const a0=i/seg*Math.PI*2, a1=(i+1)/seg*Math.PI*2;
    const sh = 0.62 + 0.38*Math.max(0, Math.cos(a0-0.6));
    const p0=[cx+Math.cos(a0)*r0, y0, cz+Math.sin(a0)*r0], p1=[cx+Math.cos(a1)*r0, y0, cz+Math.sin(a1)*r0];
    const q0=[cx+Math.cos(a0)*r1, y1, cz+Math.sin(a0)*r1], q1=[cx+Math.cos(a1)*r1, y1, cz+Math.sin(a1)*r1];
    if(r1>0.001) this.quad(p0,p1,q1,q0,col,sh); else this.tri(p0,p1,[cx,y1,cz],col,sh);
    if(o.cap && r1>0.001) this.tri([cx,y1,cz],q0,q1,o.top!==undefined?o.top:col,1.0);
  }
  return this;
};
GB.prototype.count = function(){ return this.p.length/3; };
GB.prototype.geo = function(){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.p,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(this.n,3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(this.c,3));
  g.computeBoundingSphere();
  return g;
};

/* ============================================================ 大気と時刻
   コースの進行度で「時刻」が進む。緩急の設計と絵の変化を一致させる。
     昼（本編）→ 夕焼けの黄金時間（落ち着き区間）→ 日没（大下り坂）
     → 夜とオーロラ（最終区間）
   空・霧・太陽・環境光・遠景の色をすべてこの表から補間する。          */
const ATMOS = [
  {p:0.00, zen:0x2c6cb0, hor:0xa6dcf7, low:0xd6ecfb, fog:0xb1dbf2, sunEl:52, sun:0xfff4e2, sunI:1.00,
   hemS:0xc4e6ff, hemG:0x6f93b8, hemI:0.86, far:0xffffff, glow:0.35, stars:0, aurora:0, moon:0},

const AT = { zen:new THREE.Color(), hor:new THREE.Color(), low:new THREE.Color(), fog:new THREE.Color(),
             sun:new THREE.Color(), hemS:new THREE.Color(), hemG:new THREE.Color(), far:new THREE.Color(),
             sunEl:52, sunI:1, hemI:0.85, glow:0.35, stars:0, aurora:0, moon:0, night:0 };
const _ca = new THREE.Color(), _cb = new THREE.Color();
function sampleAtmos(p){
  p = clamp(p, 0, 1);
  let i = 0; while(i < ATMOS.length-2 && p > ATMOS[i+1].p) i++;
  const a = ATMOS[i], b = ATMOS[i+1];
  const t = ease(clamp((p-a.p)/(b.p-a.p), 0, 1));
  for(const k of ['zen','hor','low','fog','sun','hemS','hemG','far'])
    AT[k].copy(_ca.setHex(a[k])).lerp(_cb.setHex(b[k]), t);
  for(const k of ['sunEl','sunI','hemI','glow','stars','aurora','moon']) AT[k] = lerp(a[k], b[k], t);
  AT.night = clamp((p-0.72)/0.06, 0, 1);
}

/* 空：カメラを包む球に、グラデーション・太陽・星・月・オーロラを描く */
const skyMat = new THREE.ShaderMaterial({
  uniforms:{
    uZen:{value:new THREE.Color()}, uHor:{value:new THREE.Color()}, uLow:{value:new THREE.Color()},
    uSunCol:{value:new THREE.Color()}, uSunDir:{value:new THREE.Vector3(0.3,0.3,-0.9).normalize()},
    uMoonDir:{value:new THREE.Vector3(-0.42,0.46,-0.78).normalize()},
    uGlow:{value:0.4}, uStars:{value:0}, uAurora:{value:0}, uMoon:{value:0}, uTime:{value:0}, uExpo:{value:1}
  },
  vertexShader:`
    varying vec3 vDir;
    void main(){
      vDir = position;
      vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      gl_Position = p.xyww;                      /* 常に一番奥に描く */
    }`,
  fragmentShader:`
    uniform vec3 uZen, uHor, uLow, uSunCol, uSunDir, uMoonDir;
    uniform float uGlow, uStars, uAurora, uMoon, uTime, uExpo;
    varying vec3 vDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1.,0.)), f.x), mix(hash(i+vec2(0.,1.)), hash(i+vec2(1.,1.)), f.x), f.y);
    }
    void main(){
      vec3 d = normalize(vDir);
      float h = d.y;
      vec3 col = (h > 0.0 ? mix(uHor, uZen, pow(clamp(h,0.0,1.0), 0.48))
                          : mix(uHor, uLow, clamp(-h*4.0, 0.0, 1.0))) * uExpo;
      /* 太陽：円盤・光冠・地平線の照り返し */
      float s = max(dot(d, uSunDir), 0.0);
      col += uSunCol * smoothstep(0.99955, 0.99975, s) * 3.0;
      col += uSunCol * (pow(s, 90.0)*0.50 + pow(s, 7.0)*0.20) * uGlow * uExpo;
      col += uSunCol * exp(-abs(h)*9.0) * pow(s, 2.5) * 0.34 * uGlow * uExpo;
      /* 星 */
      if(uStars > 0.001 && h > 0.0){
        vec2 uv = vec2(atan(d.x, -d.z), asin(h)) * 110.0;
        vec2 id = floor(uv), f = fract(uv) - 0.5;
        float r = hash(id);
        float star = step(0.975, r) * smoothstep(0.22, 0.0, length(f));
        float tw = 0.55 + 0.45*sin(uTime*(2.0+r*4.0) + r*60.0);
        col += vec3(0.85, 0.92, 1.0) * star * tw * uStars * smoothstep(0.0, 0.18, h) * 1.6;
      }
      /* 月 */
      float m = max(dot(d, uMoonDir), 0.0);
      col += vec3(0.92, 0.96, 1.0) * (smoothstep(0.99935, 0.99955, m)*1.6 + pow(m, 160.0)*0.28 + pow(m, 12.0)*0.06) * uMoon;
      /* オーロラ：下端がくっきりして上に向かって薄れる幕を、縦の筋で揺らす */
      if(uAurora > 0.001 && h > 0.02){
        float az = atan(d.x, -d.z);
        float t = uTime * 0.07;
        float a = 0.0;
        for(int i = 0; i < 3; i++){
          float fi = float(i);
          float y0 = 0.13 + fi*0.085 + 0.045*sin(az*1.7 + t*4.0 + fi*2.1) + 0.05*(noise(vec2(az*3.0 + t*3.0, fi*5.0)) - 0.5);
          float dh = h - y0;
          float band = dh < 0.0 ? exp(-dh*dh/0.0007) : exp(-dh/(0.10 + fi*0.03));
          float rays = 0.35 + 0.65*noise(vec2(az*26.0 + t*9.0 + fi*13.0, fi));
          a += band * rays * (1.0 - fi*0.25);
        }
        vec3 ac = mix(vec3(0.12, 1.0, 0.55), vec3(0.25, 0.75, 1.0), smoothstep(0.12, 0.34, h));
        ac = mix(ac, vec3(0.85, 0.30, 1.0), smoothstep(0.30, 0.55, h));
        col += ac * a * uAurora * 0.85;
      }
      gl_FragColor = vec4(col, 1.0);
    }`,
  side:THREE.BackSide, depthWrite:false, fog:false
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), skyMat);
skyDome.renderOrder = -100; skyDome.frustumCulled = false;

/* 見える太陽は画面の先（右奥）に置き、光は手前左から当てる。
   逆光だと手前を向いた面がすべて暗くなり、障害物が読めなくなるため。 */
const _sunView = new THREE.Vector3();
function applyAtmos(dt, camX, camY){
  const u = skyMat.uniforms;
  u.uZen.value.copy(AT.zen); u.uHor.value.copy(AT.hor); u.uLow.value.copy(AT.low);
  u.uSunCol.value.copy(AT.sun);
  const el = Math.max(AT.sunEl, 1.5) * Math.PI/180;
  const vEl = AT.night > 0.5 ? -0.2 : Math.min(el, 20*Math.PI/180);   /* 空に描く太陽は低めに見せる */
  _sunView.set(Math.sin(0.42)*Math.cos(vEl), Math.sin(vEl), -Math.cos(0.42)*Math.cos(vEl));
  u.uSunDir.value.copy(_sunView);
  u.uGlow.value = AT.glow; u.uStars.value = AT.stars; u.uMoon.value = AT.moon;
  /* 最終ゲートを抜けた瞬間、オーロラが一気に燃え上がる */
  AT.kick = (AT.kick||0) + (((typeof G!=='undefined' && G.rush) ? 0.65 : 0) - (AT.kick||0)) * Math.min(1, dt*1.4);
  u.uAurora.value = AT.aurora + AT.kick;
  u.uTime.value += dt;
  skyDome.position.set(camX, camY, camera.position.z);
  /* 光：高度が下がるほど影が長くなる */
  const lEl = Math.max(el, 10*Math.PI/180);
  sun.position.set(-Math.cos(lEl)*0.80, Math.sin(lEl), Math.cos(lEl)*0.56).multiplyScalar(80);   /* 横寄りから当てる */
  /* 一番明るく照らされる面が白飛びしない強さに正規化する（雪に陰影が残る） */
  const peak = AT.hemI*0.92 + AT.sunI*Math.sin(lEl);           // 上を向いた雪面の明るさ
  const norm = 1.08 / Math.max(1.0, peak);
  sun.color.copy(AT.sun); sun.intensity = AT.sunI * norm * expo();
  hemi.color.copy(AT.hemS); hemi.groundColor.copy(AT.hemG); hemi.intensity = AT.hemI * norm * expo();
  skyMat.uniforms.uExpo.value = expo();
  scene.fog.color.copy(AT.fog);
  renderer.setClearColor(AT.fog);
  for(const L of farLayers) L.meshes[0].material.color.copy(AT.far).multiplyScalar(expo()*0.97);
  /* 影はプレイヤーの周りだけ。光の向きに沿って置き直す */
  sun.target.position.set(camX - 3, camY - 4, 0);
  sun.position.add(sun.target.position);
  /* 材質：黄金時間と夜はきらめきを強く、夜は氷の縁を青く光らせる */
  WU.uSparkle.value = 0.55 + 0.45*clamp((AT.glow-0.35)/0.65, 0, 1) + 0.35*AT.night;
  WU.uRim.value = 0.14 + 0.30*AT.night;
  WU.uRimCol.value.copy(AT.hemS).lerp(_ca.setHex(0x8ff0ff), AT.night*0.7);
  WU.uTime.value += dt;
  /* 色調：昼は素直に、黄金時間は暖かく、夜は青く締める */
  const warm = clamp((AT.glow-0.35)/0.65, 0, 1) * (1-AT.night);
  compMat.uniforms.uGain.value.set(1.0 + 0.06*warm - 0.05*AT.night, 1.0 - 0.01*warm, 1.0 - 0.07*warm + 0.06*AT.night);
  compMat.uniforms.uLift.value.set(0.02*warm, 0.0, 0.035*AT.night);
  compMat.uniforms.uSat.value = 1.06 + 0.08*warm;
  compMat.uniforms.uVig.value = 0.45 + 0.25*AT.night;
  PF.bloom = 0.50 + 0.40*AT.night + 0.10*warm;
}

/* ============================================================ 画質設定
   LOW：ポスト処理なし・影なし／MED：ブルーム＋影／HIGH：全部（放射ブラー・色収差）
   端末で初期値を決め、重ければ自動で1段ずつ下げる。G キーで手動切替。 */
const IS_MOBILE = matchMedia('(hover:none)').matches || 'ontouchstart' in window;
const QUALITY = [
  {name:'LOW',  post:false, fx:false, shadows:false, shadowSize:512,  pr:1.0},
  {name:'MED',  post:true,  fx:false, shadows:true,  shadowSize:1024, pr:1.35},
  {name:'HIGH', post:true,  fx:true,  shadows:true,  shadowSize:2048, pr:1.75}

let qIdx = IS_MOBILE ? 1 : 2, qAuto = true;
const Q = () => QUALITY[qIdx];
/* ポスト処理ありのときは、シーンを EXPO 分だけ暗く描いて合成で戻す。
   こうすると真っ白な雪はブルームの閾値を越えず、発光体だけが光る。 */
const EXPO = 1.24;
const expo = () => Q().post ? 1/EXPO : 1;

/* ---- 影：太陽（夜は月）から。プレイヤーの周りだけを高解像度で落とす ---- */
renderer.shadowMap.enabled = Q().shadows;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
sun.castShadow = true;
sun.shadow.mapSize.set(Q().shadowSize, Q().shadowSize);
(function(){ const c = sun.shadow.camera; c.left=-34; c.right=34; c.top=22; c.bottom=-22; c.near=1; c.far=240;
  c.updateProjectionMatrix(); })();
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
scene.add(sun.target);

/* ---- 材質：雪のきらめき・氷の縁の光（フレネル）を Phong に差し込む ---- */
const WU = { uSparkle:{value:0.7}, uRim:{value:0.25}, uRimCol:{value:new THREE.Color(0xbfe8ff)},
             uTime:{value:0} };
function glamour(mat, sparkle){
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, WU);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNrm;')
      .replace('#include <project_vertex>', '#include <project_vertex>\n vWPos = (modelMatrix*vec4(transformed,1.0)).xyz;\n vWNrm = normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNrm;\nuniform float uSparkle, uRim, uTime;\nuniform vec3 uRimCol;')
      .replace('#include <tonemapping_fragment>', `
        {
          vec3 N = normalize(vWNrm);
          vec3 V = normalize(cameraPosition - vWPos);
          float side = 1.0 - clamp(N.y, 0.0, 1.0);
          float fr = pow(1.0 - max(dot(N, V), 0.0), 3.0);
          gl_FragColor.rgb += uRimCol * fr * uRim * (0.12 + 0.88*side);
          ${sparkle ? `
          /* 雪のきらめき：上を向いた白い面だけ。視点が動くと瞬く */
          #ifdef USE_COLOR
          float white = smoothstep(0.80, 0.95, min(vColor.r, min(vColor.g, vColor.b)));
          #else
          float white = 1.0;
          #endif
          vec3 cell = floor(vWPos * vec3(5.0, 5.0, 5.0));
          float r = fract(sin(dot(cell, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
          float tw = pow(max(0.0, sin(r*97.0 + dot(V, vec3(41.0, 23.0, 29.0)) + uTime*1.3)), 30.0);
          gl_FragColor.rgb += vec3(1.0, 0.97, 0.9) * step(0.9, r) * tw * clamp(N.y, 0.0, 1.0) * white * uSparkle * 1.6;
          /* 面のむら：平らな色に大きな濃淡を足す */
          vec2 q = vWPos.xz * 0.23;
          float n = fract(sin(dot(floor(q), vec2(127.1, 311.7))) * 43758.5453);
          gl_FragColor.rgb *= 0.965 + 0.05 * n;` : ''}
        }
        #include <tonemapping_fragment>`);
  };
  return mat;
}
const worldMatHi = glamour(new THREE.MeshPhongMaterial({vertexColors:true, shininess:18, specular:0x10161e}), true);
const propMatHi  = glamour(new THREE.MeshPhongMaterial({vertexColors:true, shininess:40, specular:0x2a2a2a}), false);
/* LOW は頂点ライティング（Lambert）に落として、弱い端末でも軽く回す */
const worldMatLo = new THREE.MeshLambertMaterial({vertexColors:true});
const propMatLo  = new THREE.MeshLambertMaterial({vertexColors:true});
let worldMat = Q().post ? worldMatHi : worldMatLo;
let propMat  = Q().post ? propMatHi  : propMatLo;
function swapMaterials(){
  const w = Q().post ? worldMatHi : worldMatLo, p = Q().post ? propMatHi : propMatLo;
  const map = new Map([[worldMatHi,w],[worldMatLo,w],[propMatHi,p],[propMatLo,p]]);
  scene.traverse(o=>{ if(o.isMesh && map.has(o.material)) o.material = map.get(o.material); });
  worldMat = w; propMat = p;
}
const worldGroup = new THREE.Group(); scene.add(worldGroup);
const farGroup = new THREE.Group(); scene.add(farGroup);

/* ============================================================ ポスト処理
   シーン → (明部抽出 → ぼかし×2) → 合成（ブルーム・色調・周辺減光・
   速度の放射ブラー・色収差・被弾の赤）。LOW では丸ごと飛ばす。        */
const isGL2 = renderer.capabilities.isWebGL2;
function makeRT(ms){
  const o = {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat};
  if(ms && isGL2 && THREE.WebGLMultisampleRenderTarget){
    const rt = new THREE.WebGLMultisampleRenderTarget(2, 2, o); rt.samples = 4; return rt;
  }
  return new THREE.WebGLRenderTarget(2, 2, o);
}
const rtScene = makeRT(true), rtA = makeRT(false), rtB = makeRT(false);
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postGeo = new THREE.BufferGeometry();
postGeo.setAttribute('position', new THREE.Float32BufferAttribute([-1,-1,0, 3,-1,0, -1,3,0], 3));
postGeo.setAttribute('uv', new THREE.Float32BufferAttribute([0,0, 2,0, 0,2], 2));
const postQuad = new THREE.Mesh(postGeo); postQuad.frustumCulled = false;
const postScene = new THREE.Scene(); postScene.add(postQuad);
const PVS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const brightMat = new THREE.ShaderMaterial({ depthTest:false, depthWrite:false,
  uniforms:{ tDiffuse:{value:null}, uTexel:{value:new THREE.Vector2()}, uThresh:{value:0.92} },
  vertexShader:PVS, fragmentShader:`
    uniform sampler2D tDiffuse; uniform vec2 uTexel; uniform float uThresh; varying vec2 vUv;
    vec3 pick(vec2 o){ vec3 c = texture2D(tDiffuse, vUv + o*uTexel).rgb;
      float l = max(c.r, max(c.g, c.b)); return c * smoothstep(uThresh, 1.0, l); }
    void main(){ gl_FragColor = vec4((pick(vec2(-1.,-1.)) + pick(vec2(1.,-1.)) + pick(vec2(-1.,1.)) + pick(vec2(1.,1.)))*0.25, 1.0); }`});
const blurMat = new THREE.ShaderMaterial({ depthTest:false, depthWrite:false,
  uniforms:{ tDiffuse:{value:null}, uDir:{value:new THREE.Vector2()} },
  vertexShader:PVS, fragmentShader:`
    uniform sampler2D tDiffuse; uniform vec2 uDir; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb * 0.2270;
      c += (texture2D(tDiffuse, vUv + uDir*1.3846).rgb + texture2D(tDiffuse, vUv - uDir*1.3846).rgb) * 0.3162;
      c += (texture2D(tDiffuse, vUv + uDir*3.2308).rgb + texture2D(tDiffuse, vUv - uDir*3.2308).rgb) * 0.0703;
      gl_FragColor = vec4(c, 1.0); }`});
const compMat = new THREE.ShaderMaterial({ depthTest:false, depthWrite:false,
  uniforms:{ tScene:{value:null}, tBloom:{value:null}, uBloom:{value:0.9}, uRadial:{value:0},
             uCA:{value:0}, uFocus:{value:new THREE.Vector2(0.3,0.5)}, uVig:{value:0.55},
             uGain:{value:new THREE.Vector3(1,1,1)}, uLift:{value:new THREE.Vector3(0,0,0)},
             uSat:{value:1.08}, uContrast:{value:1.06}, uHurt:{value:0}, uTime:{value:0}, uFx:{value:1},
             uFlash:{value:0}, uFlashCol:{value:new THREE.Color(1,1,1)} },
  vertexShader:PVS, fragmentShader:`
    uniform sampler2D tScene, tBloom;
    uniform float uBloom, uRadial, uCA, uVig, uSat, uContrast, uHurt, uTime, uFx, uFlash;
    uniform vec2 uFocus; uniform vec3 uGain, uLift, uFlashCol;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 uv = vUv, d = uv - uFocus;
      vec3 col;
      if(uFx > 0.5 && uRadial > 0.0005){
        vec3 acc = vec3(0.0);
        for(int i = 0; i < 6; i++){ float t = float(i)/5.0; acc += texture2D(tScene, uv - d*uRadial*t).rgb; }
        col = acc / 6.0;
      } else col = texture2D(tScene, uv).rgb;
      if(uFx > 0.5 && uCA > 0.0005){
        float k = uCA * dot(d, d);
        col.r = mix(col.r, texture2D(tScene, uv - d*k).r, 0.85);
        col.b = mix(col.b, texture2D(tScene, uv + d*k).b, 0.85);
      }
      col += texture2D(tBloom, uv).rgb * uBloom;
      col *= ${EXPO.toFixed(3)};
      col = col * uGain + uLift * (1.0 - col);
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, uSat);
      col = (col - 0.5) * uContrast + 0.5;
      float v = smoothstep(1.02, 0.28, length((uv - 0.5) * vec2(1.3, 1.0)));
      col *= mix(1.0, v, uVig);
      col = mix(col, vec3(0.95, 0.12, 0.10), uHurt * (1.0 - v) * 0.85);
      col = mix(col, uFlashCol, uFlash);
      col += (hash(uv * (uTime + 1.7)) - 0.5) * 0.018;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }`});
const PF = { radial:0, ca:0, hurt:0, flash:0, bloom:0.9 };
function sizePost(){
  const s = renderer.getDrawingBufferSize(new THREE.Vector2());
  rtScene.setSize(s.x, s.y);
  const bw = Math.max(2, Math.floor(s.x/4)), bh = Math.max(2, Math.floor(s.y/4));
  rtA.setSize(bw, bh); rtB.setSize(bw, bh);
  brightMat.uniforms.uTexel.value.set(1/s.x, 1/s.y);
  blurMat.userData.texel = new THREE.Vector2(1/bw, 1/bh);
}
function pass(mat, target){ postQuad.material = mat; renderer.setRenderTarget(target); renderer.render(postScene, postCam); }
function renderFrame(){
  if(!Q().post){ renderer.setRenderTarget(null); renderer.render(scene, camera); return; }
  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  brightMat.uniforms.tDiffuse.value = rtScene.texture; pass(brightMat, rtA);
  const tx = blurMat.userData.texel;
  for(let k = 1; k <= 2; k++){
    blurMat.uniforms.tDiffuse.value = rtA.texture; blurMat.uniforms.uDir.value.set(tx.x*k, 0); pass(blurMat, rtB);
    blurMat.uniforms.tDiffuse.value = rtB.texture; blurMat.uniforms.uDir.value.set(0, tx.y*k); pass(blurMat, rtA);
  }
  const u = compMat.uniforms;
  u.tScene.value = rtScene.texture; u.tBloom.value = rtA.texture;
  u.uFx.value = Q().fx ? 1 : 0; u.uRadial.value = PF.radial; u.uCA.value = PF.ca;
  u.uHurt.value = PF.hurt; u.uFlash.value = PF.flash; u.uBloom.value = PF.bloom;
  u.uTime.value = (u.uTime.value + 0.013) % 100;
  pass(compMat, null);
}
/* シェーダーを先にまとめてコンパイルしておく（初回プレイのカクつき防止） */
function precompile(){ try{ renderer.compile(scene, camera); }catch(e){} }
function setQuality(i, manual){
  qIdx = clamp(i, 0, QUALITY.length-1);
  if(manual) qAuto = false;
  const q = Q();
  renderer.shadowMap.enabled = q.shadows;
  if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
  sun.shadow.mapSize.set(q.shadowSize, q.shadowSize);
  swapMaterials();
  for(const m of [worldMatHi, propMatHi, worldMatLo, propMatLo, crystalMat]) m.needsUpdate = true;
  resize();
  precompile();
  const el = document.getElementById('qnote');
  if(el){ el.textContent = '画質 ' + q.name + (qAuto ? '' : '（固定）'); el.style.opacity = 1;
          clearTimeout(el._t); el._t = setTimeout(()=>{ el.style.opacity = 0; }, 1400); }
}

/* ================================================ 静的ワールドの組み立て
   区画(110m)ごとに1メッシュへ焼き込む。ドローコールは十数個で済む。   */
const SECTION = 110;
function inIce(W,x){ for(const s of W.ices) if(x>=s.x0 && x<=s.x1) return true; return false; }

function buildStaticWorld(W){
  while(worldGroup.children.length){ const m=worldGroup.children.pop(); m.geometry.dispose(); }
  const nSec = Math.ceil(W.length/SECTION)+1;
  const secs = []; for(let i=0;i<nSec;i++) secs.push(new GB());
  const at = x => secs[clamp(Math.floor(x/SECTION),0,nSec-1)];
  const rnd = mulberry(0x5eed01);
  const G = CL.ground, I = CL.ice, B = CL.block, A = CL.arch, T = CL.tree, R = CL.rock;
  /* 任意の x の地面の高さ（穴の上なら一番近い縁の高さ） */
  const gyAt = x => {
    let best=null, bd=Infinity;
    for(const s of W.surfaces){
      if(s.kind!=='ground') continue;
      if(x>=s.x0 && x<=s.x1) return surfY(s,x);
      const d = x<s.x0 ? s.x0-x : x-s.x1;
      if(d<bd){ bd=d; best = x<s.x0 ? s.y : s.y1; }
    }
    return best===null ? 0 : best;
  };

  /* --- 地面と足場（傾斜に対応。4m ごとの小片に割って焼き込む） --- */
  const ZH = 5.5;                                  // コース半幅
  function slab(gb, x0,y0,x1,y1, band, capL, capR){
    /* 上面 */
    const A=[x0,y0,ZH], B=[x1,y1,ZH], C=[x1,y1,-ZH], D=[x0,y0,-ZH];
    gb.quad(A,B,C,D, band ? G.top : G.top2, 1.0);
    /* 手前と奥の断面（上面と平行に色を3段変える） */
    const bands = [[0.0,0.9,G.top2,0.98],[0.9,3.5,G.side,0.74],[3.5,6.4,G.deep,0.6]];
    for(const [u,v,col,sh] of bands){
      /* 手前は +z、奥は -z を向くように頂点を並べる（逆だと裏面として消える） */
      gb.quad([x0,y0-v,ZH],[x1,y1-v,ZH],[x1,y1-u,ZH],[x0,y0-u,ZH], col, sh);
      gb.quad([x1,y1-v,-ZH],[x0,y0-v,-ZH],[x0,y0-u,-ZH],[x1,y1-u,-ZH], col, sh*0.72);
    }
    /* 左右の小口は面の端だけ */
    if(capL) gb.quad([x0,y0,ZH],[x0,y0,-ZH],[x0,y0-6.4,-ZH],[x0,y0-6.4,ZH], G.side, 0.7);
    if(capR) gb.quad([x1,y1,-ZH],[x1,y1,ZH],[x1,y1-6.4,ZH],[x1,y1-6.4,-ZH], G.side, 0.72);
  }
  for(const s of W.surfaces){
    if(s.kind==='block') continue;                 // 氷塊の上面は障害物側で描く
    const w = s.x1-s.x0, cx=(s.x0+s.x1)/2, gb = at(cx);
    if(s.kind==='ground'){
      const m = surfSlope(s);
      let i = 0;
      for(let x=s.x0; x<s.x1-0.001; x+=4, i++){
        const xe = Math.min(x+4, s.x1);
        slab(gb, x, surfY(s,x), xe, surfY(s,xe), i%2===0, x===s.x0, xe>=s.x1-0.001);
      }
      /* 奥と手前の雪の土手（コースの枠）。斜面では低くして段差を出さない */
      const bankH = Math.abs(m) > 0.08 ? 0.34 : 0.85;
      for(let x=s.x0; x<s.x1-0.001; x+=6){
        const xe = Math.min(x+6, s.x1), w2=xe-x;
        const ya = surfY(s,x)+0.03, yb2 = surfY(s,xe)+0.03;
        gb.quad([x,ya+bankH,-4.2],[xe,yb2+bankH,-4.2],[xe,yb2+bankH,-5.6],[x,ya+bankH,-5.6], G.top, 1.0);
        gb.quad([x,ya,-4.2],[xe,yb2,-4.2],[xe,yb2+bankH,-4.2],[x,ya+bankH,-4.2], G.lip, 0.86);
        gb.quad([x,ya+bankH*0.6,4.2],[xe,yb2+bankH*0.6,4.2],[xe,yb2+bankH*0.6,5.6],[x,ya+bankH*0.6,5.6], G.top2, 1.0);
        gb.quad([x,ya,5.6],[xe,yb2,5.6],[xe,yb2+bankH*0.6,5.6],[x,ya+bankH*0.6,5.6], G.lip, 0.92);
      }
      /* 雪のこぶ */
      for(let x=s.x0+2; x<s.x1-2; x+=7.3){
        const zz = -3.6 + ((x*7)%9);
        gb.taper(x, surfY(s,x)+0.02, zz, 2.2, 1.6, 1.0, 0.7, 0.22, G.lip, {top:G.top2, noBottom:true});
      }
      /* 崖端のつらら */
      for(const ex of [s.x0, s.x1]){
        const dir = ex===s.x0 ? 0.35 : -0.35, ey = surfY(s, ex);
        for(let k=0;k<3;k++)
          gb.icicle(ex+dir*(0.4+k*0.5), ey-0.3, -3.2+k*3.2, 0.34, 0.9+rnd()*1.5, I.top);
      }
      /* 急な斜面には滑走痕を入れて、傾きが一目で分かるようにする */
      if(Math.abs(m) > 0.12){
        for(let x=s.x0+1.5; x<s.x1-1.5; x+=3.2){
          const xc=x, yc=surfY(s,xc);
          gb.box(xc, yc+0.03, -2.2+((x*3)%5), 1.9, 0.05, 0.30, G.top2, {top:G.top2, shTop:0.92});
        }
      }
    }else{ /* 浮き足場（レール） */
      gb.box(cx, s.y-0.45, 0, w, 0.9, 8.2, I.side, {top:G.top, bot:I.side});
      gb.box(cx, s.y-0.05, 0, w+0.35, 0.34, 8.6, G.lip, {top:G.top, shZ:0.95});
      for(let k=0;k<4;k++)
        gb.icicle(s.x0+w*(0.16+0.23*k), s.y-0.9, -2.4+k*1.7, 0.32, 0.8+rnd()*1.2, I.top);
    }
  }
  /* --- 氷結ゾーン（地面の上に薄い氷を重ねる） --- */
  for(const z of W.ices){
    for(let x=z.x0; x<z.x1; x+=4){
      const w = Math.min(4, z.x1-x), cx=x+w/2, gb=at(cx);
      const ya = gyAt(x)+0.02, yb = gyAt(x+w)+0.02;
      gb.quad([x,ya+0.2,5.3],[x+w,yb+0.2,5.3],[x+w,yb+0.2,-5.3],[x,ya+0.2,-5.3], I.top, 1.04);
      gb.quad([x,ya-0.1,5.3],[x+w,yb-0.1,5.3],[x+w,yb+0.2,5.3],[x,ya+0.2,5.3], I.side, 0.9);
      gb.box(cx, (ya+yb)/2+0.24, -3.6+(x%3), w*0.62, 0.04, 1.3, I.spec, {top:I.spec, shTop:1.12});
      gb.box(cx-w*0.2, (ya+yb)/2+0.24, 1.4+(x%4)*0.6, w*0.34, 0.04, 0.5, I.spec, {top:I.spec, shTop:1.12});
    }
    /* 端に氷の縁を立てて、入口と出口を分かるようにする */
    for(const ex of [z.x0, z.x1]){
      const ey = gyAt(ex);
      at(ex).taper(ex, ey+0.2, -4.4, 0.7, 1.2, 0.3, 0.7, 0.9, I.top, {top:I.spec});
      at(ex).taper(ex, ey+0.2,  4.4, 0.7, 1.2, 0.3, 0.7, 0.9, I.top, {top:I.spec});
    }
  }
  /* --- 障害物 --- */
  for(const h of W.hazards){
    const gb = at(h.cx), b = h.base||0;
    if(h.type==='block'){
      if(B.shape==='icicle'){
        gb.taper(h.cx, b, 0, h.w*1.15, 3.0, h.w*0.9, 2.2, h.h, B.main, {top:B.tip});
        gb.taper(h.cx, b, 0, h.w*0.55, 2.0, h.w*0.3, 1.0, h.h*1.28, B.edge, {top:B.tip, noBottom:true});
        gb.spike(h.cx-h.w*0.75, b, -1.6, h.w*0.5, h.h*0.72, B.edge);
        gb.spike(h.cx+h.w*0.7, b, 1.5, h.w*0.45, h.h*0.6, B.edge);
        gb.box(h.cx, b+h.h-0.06, 0, h.w*1.2, 0.16, 2.3, CL.ground.lip, {top:CL.ground.top});
      }else{
        gb.taper(h.cx, b, 0, h.w*1.2, 3.0, h.w, 2.4, h.h, B.main, {top:B.tip});
        gb.box(h.cx-h.w*0.6, b+h.h*0.35, 1.0, h.w*0.5, h.h*0.5, 1.6, B.edge);
      }
    }else{ /* くぐる障害物 */
      gb.box(h.cx, h.yb+2.0, 0, h.w+0.6, 1.7, 9.4, A.edge, {top:CL.ground.top, bot:A.main});
      for(let i=0;i<7;i++){
        const t=i/6, x=h.x0+0.25+(h.w-0.5)*t;
        for(let k=0;k<3;k++)
          gb.icicle(x, h.yb+1.15, -3.4+k*3.4, 0.30, 1.15-(k===1?0:0.25), A.main);
      }
      for(const zz of [-4.3, 4.3]){
        gb.taper(h.x0-0.2, b, zz, 1.1, 1.1, 0.8, 0.8, h.yb+2.9-b, A.edge, {top:A.main});
        gb.taper(h.x1+0.2, b, zz, 1.1, 1.1, 0.8, 0.8, h.yb+2.9-b, A.edge, {top:A.main});
      }
    }
  }
  /* --- 減速サイン（この先は詰まっている、の予告） --- */
  for(const s of W.signs){
    const gb = at(s.x), b = s.y||0;
    gb.cyl(s.x, b, 4.0, 0.16, 0.16, 2.6, 6, 0x35506e, {cap:true});
    gb.box(s.x, b+2.9, 4.0, 1.9, 1.2, 0.18, 0xffd23f, {top:0xffd23f, shZ:1.05});
    gb.box(s.x, b+2.9, 4.09, 1.3, 0.62, 0.06, 0x1b2b3f, {top:0x1b2b3f, shZ:1.05});
    for(let i=0;i<3;i++) gb.box(s.x-0.40+i*0.40, b+2.9, 4.14, 0.20, 0.46, 0.05, 0xffd23f, {shZ:1.1});
  }
  /* --- 最終区間のゲート（くぐるだけ。当たり判定は無い） --- */
  for(const g of W.gates){
    const gb = at(g.x), b = g.y;
    for(const zz of [-5.0, 5.0]){
      gb.taper(g.x, b, zz, 1.6, 1.6, 1.1, 1.1, 8.4, CL.arch.edge, {top:CL.ground.top});
      gb.spike(g.x, b+8.4, zz, 1.4, 1.6, CL.block.tip);
    }
    gb.box(g.x, b+8.0, 0, 1.2, 1.0, 10.6, CL.arch.edge, {top:CL.ground.top});
    for(let i=0;i<9;i++)
      gb.icicle(g.x, b+7.5, -4.4+i*1.1, 0.34, 1.0+((i*7)%5)*0.28, CL.arch.main);
    for(let i=0;i<6;i++)
      gb.box(g.x+0.65, b+8.0, -4.4+i*1.8, 0.10, 0.9, 1.5, i%2?0xffd23f:0xe8503f,
             {shZ:1.05, top:i%2?0xffd23f:0xe8503f});
  }
  /* --- ゴール --- */
  if(W.goalX){
    const gb = at(W.goalX), gx = W.goalX, GC = CL.goal, gy0 = W.goalY||0;
    for(const zz of [-4.6, 4.6]){
      gb.taper(gx, gy0, zz, 1.0, 1.0, 0.7, 0.7, 6.4, GC.post, {top:GC.flag});
      gb.box(gx, gy0+6.9, zz, 1.3, 0.5, 1.3, GC.flag, {top:GC.flag});
    }
    gb.box(gx, gy0+6.2, 0, 1.0, 1.1, 9.4, GC.post, {top:GC.post});
    for(let i=0;i<10;i++)
      gb.box(gx+0.55, gy0+6.2, -4.3+i*0.95, 0.12, 1.0, 0.95, i%2 ? 0xffffff : 0x1b2b3f, {shZ:1.05, top:i%2?0xffffff:0x1b2b3f});
    for(let i=0;i<10;i++)
      gb.box(gx-0.55, gy0+6.2, -4.3+i*0.95, 0.12, 1.0, 0.95, i%2 ? 0x1b2b3f : 0xffffff, {shZ:1.05, top:i%2?0xffffff:0x1b2b3f});
  }
  /* --- 背景の木・岩・雪山（ステージ全域にばら撒く） --- */
  for(let x=6; x<W.length+40; x += 5 + rnd()*9){
    const gb = at(x), by = gyAt(x);
    const back = rnd()<0.72;
    const z = back ? -(8 + rnd()*20) : (9 + rnd()*7);
    const s = back ? (0.85 + rnd()*1.5) : (0.30 + rnd()*0.34);
    const r = back ? rnd() : 0.72 + rnd()*0.28;         /* 手前には木を置かない（視界を塞ぐため） */
    if(r < 0.62){                                        /* 木 */
      if(T.shape==='pine'){
        const h = 3.4*s;
        gb.cyl(x, by, z, 0.22*s, 0.18*s, h*0.32, 5, T.trunk);
        for(let k=0;k<3;k++){
          const yy = h*0.24 + k*h*0.26, ss = (1.9-k*0.45)*s;
          gb.spike(x, by+yy, z, ss, h*0.55, k===2?T.leaf2:T.leaf);
          gb.spike(x, by+yy+h*0.30, z, ss*0.55, h*0.2, T.snow, {noBottom:true});
        }
      }else{
        const h=4.2*s;
        gb.cyl(x, by, z, 0.26*s, 0.16*s, h, 5, T.trunk);
        for(let k=0;k<5;k++){
          const a=k/5*Math.PI*2;
          gb.box(x+Math.cos(a)*1.1*s, by+h-0.2*s, z+Math.sin(a)*1.1*s, 2.3*s, 0.18*s, 0.7*s, T.leaf, {top:T.leaf2});
        }
      }
    } else if(r < 0.82){                                  /* 岩 */
      const s2 = s*(0.7+rnd()*0.6);
      gb.taper(x, by, z, 1.7*s2, 1.6*s2, 1.1*s2, 1.0*s2, 1.2*s2, R.main, {top:R.snow});
    } else {                                              /* 雪の丘 */
      const s3 = s*(1.4+rnd());
      gb.taper(x, by-0.2, z, 4.2*s3, 3.4*s3, 1.6*s3, 1.4*s3, 1.1*s3, CL.ground.lip, {top:CL.ground.top, noBottom:true});
    }
  }
  /* ============================================ 見せ場の背景（区間ごとの顔） */
  const glows = []; for(let i=0;i<nSec;i++) glows.push(new GB());
  const glowAt = x => glows[clamp(Math.floor(x/SECTION),0,nSec-1)];
  const pools = [];                                   // 地面に落ちる光だまり
  const M = W.marks, tree = (gb, x, z, s, by) => {
    const h = 3.4*s;
    gb.cyl(x, by, z, 0.22*s, 0.18*s, h*0.32, 5, T.trunk);
    for(let k=0;k<3;k++){
      const yy = h*0.24 + k*h*0.26, ss = (1.9-k*0.45)*s;
      gb.spike(x, by+yy, z, ss, h*0.55, k===2?T.leaf2:T.leaf);
      gb.spike(x, by+yy+h*0.30, z, ss*0.55, h*0.2, T.snow, {noBottom:true});
    }
  };
  /* 1. 出だしの森：コースの奥に針葉樹を密に並べ、手前の下端にも梢をのぞかせる */
  for(let x=0; x<(M.w2_duck||220); x+=2.6+rnd()*3.2){
    tree(at(x), x, -(6.6 + rnd()*6), 0.9 + rnd()*0.8, gyAt(x));
    if(rnd() < 0.30) tree(at(x), x+1.3, 12 + rnd()*5, 1.1 + rnd()*0.7, gyAt(x) - 10.5);
  }
  /* 2. 氷結区間：奥に光る氷晶の群れ（夜ではないが、ブルームでほのかに光る） */
  if(M.w3_ice){
    for(let x=M.w3_ice+8; x<M.w3_ice+128; x+=5+rnd()*6){
      const gb = glowAt(x), by = gyAt(x), z = -(6.2 + rnd()*4), n = 3 + Math.floor(rnd()*4);
      for(let k=0;k<n;k++){
        const h = 1.2 + rnd()*2.8, dx = (rnd()-0.5)*2.2, dz = (rnd()-0.5)*1.6;
        gb.spike(x+dx, by-0.1, z+dz, 0.35+rnd()*0.35, h, rnd()<0.5 ? 0x7fe8ff : 0xb8f4ff);
      }
      pools.push([x, by+0.08, z+1.4, 3.2, 0x5fd8ff]);
    }
  }
  /* 3. ジャンプ台の奥の凍った滝 */
  if(M.w4_launch){
    const gb = at(M.w4_launch+40), cx = M.w4_launch + 44, by = gyAt(cx), z = -34;
    gb.box(cx, by+11, z-3, 30, 26, 4, 0x6f8fae, {top:0xffffff});             // 岩壁
    for(let k=0;k<11;k++){
      const x = cx - 10 + k*2 + (rnd()-0.5), w = 1.6 + rnd()*1.4, h = 14 + rnd()*9;
      gb.taper(x, by-1, z, w*1.3, 1.6, w*0.8, 1.2, h, k%2 ? 0xbff0ff : 0x9fe0fa, {top:0xffffff});
      for(let j=0;j<3;j++) gb.icicle(x+(rnd()-0.5)*w, by-1+h*(0.45+j*0.15), z+0.9, 0.5, 1.4+rnd()*2, 0xd8f8ff);
    }
    gb.taper(cx, by-1.2, z+2, 26, 5, 18, 3, 1.6, 0xd8f4ff, {top:0xf4feff});     // 滝壺の氷
  }
  /* 4. 最終区間：灯籠がコースの両脇に並ぶ（オーロラの下で暖かく光る） */
  const gateX = W.gates.length ? W.gates[0].x : 0;
  if(gateX){
    for(let x=gateX+6; x<W.goalX+20; x+=11){
      for(const z of [-5.3, 5.9]){
        const by = gyAt(x);
        at(x).cyl(x, by, z, 0.10, 0.08, 2.5, 5, 0x2a3346, {cap:true});
        at(x).box(x, by+2.55, z, 0.62, 0.10, 0.62, 0x2a3346, {top:0x2a3346});
        const g = glowAt(x);
        g.box(x, by+2.9, z, 0.42, 0.58, 0.42, 0xffc070, {top:0xffe0a0});
        g.box(x, by+2.9, z, 0.18, 0.72, 0.18, 0xfff2d0, {top:0xffffff});
        pools.push([x, by+0.06, z*0.72, 3.0, 0xffa550]);
      }
    }
  }
  for(let i=0;i<secs.length;i++){
    if(!secs[i].count()) continue;
    const m = new THREE.Mesh(secs[i].geo(), worldMat);
    m.castShadow = true; m.receiveShadow = true;
    worldGroup.add(m);
  }
  /* 発光する部品（灯籠・氷晶）は照明を受けない材質で、ブルームに拾わせる */
  for(let i=0;i<glows.length;i++){
    if(!glows[i].count()) continue;
    worldGroup.add(new THREE.Mesh(glows[i].geo(), glowMat));
  }
  /* 光だまり：放射グラデーションの板を加算で地面に置く */
  if(pools.length){
    const im = new THREE.InstancedMesh(POOL_GEO, poolMat, pools.length);
    const o = new THREE.Object3D(), c = new THREE.Color();
    pools.forEach((p,i)=>{ o.position.set(p[0], p[1], p[2]); o.rotation.set(-Math.PI/2, 0, 0);
      o.scale.set(p[3], p[3], 1); o.updateMatrix(); im.setMatrixAt(i, o.matrix); im.setColorAt(i, c.setHex(p[4])); });
    im.instanceMatrix.needsUpdate = true; if(im.instanceColor) im.instanceColor.needsUpdate = true;
    worldGroup.add(im);
  }
}

const farLayers = [];
function buildFar(){
  while(farGroup.children.length){ const m=farGroup.children.pop(); m.geometry.dispose(); }
  farLayers.length = 0;
  const defs = [
    {z:-165, f:0.10, h:34, col:CL.far.deep, w:340, n:9,  base:-6},
    {z:-115, f:0.22, h:24, col:CL.far.mid,  w:300, n:11, base:-6},
    {z:-72,  f:0.42, h:15, col:CL.far.near, w:260, n:13, base:-5}
  ];
  defs.forEach((d,li)=>{
    const gb = new GB(); const rnd = mulberry(1234+li*77);
    let x = -d.w/2;
    const step = d.w/d.n;
    for(let i=0;i<d.n;i++){
      const px = x + step*(0.4+rnd()*0.4), pw = step*(1.1+rnd()*0.7), ph = d.h*(0.5+rnd()*0.75);
      gb.tri([px-pw/2,d.base,d.z],[px+pw/2,d.base,d.z],[px,d.base+ph,d.z], d.col, 1.0);
      gb.tri([px-pw*0.16,d.base+ph*0.62,d.z+0.4],[px+pw*0.16,d.base+ph*0.62,d.z+0.4],[px,d.base+ph,d.z+0.4], 0xffffff, 1.0);
      x += step;
    }
    const geo = gb.geo();
    const mat = new THREE.MeshBasicMaterial({vertexColors:true, fog:true});
    const set = [];
    for(let k=0;k<3;k++){ const m=new THREE.Mesh(geo,mat); m.frustumCulled=false; farGroup.add(m); set.push(m); }
    farLayers.push({meshes:set, f:d.f, w:d.w});
  });
}
function updateFar(camX, camY){
  for(const L of farLayers){
    const base = camX*(1-L.f);
    const k = Math.round(camX*L.f/L.w);
    const dy = (camY-4.5)*(1-L.f);      // 遠いほどカメラに合わせて動く＝画面上で止まって見える
    L.meshes.forEach((m,i)=>{ m.position.x = base + (k+i-1)*L.w; m.position.y = dy; });
  }
}

/* ============================================================== 粒子
   1粒ごとに大きさ・透明度・色を持つ、丸くて柔らかい点スプライト。
   雪煙（通常合成）と、光の粒（加算合成）の2系統を使い回す。           */
const FXVS = `
  attribute float aSize; attribute float aAlpha; attribute vec3 aColor;
  varying float vAlpha; varying vec3 vColor; uniform float uScale;
  void main(){
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * uScale / -mv.z;
    vAlpha = aAlpha; vColor = aColor;
    gl_Position = projectionMatrix * mv;
  }`;
const FXFS = `
  varying float vAlpha; varying vec3 vColor; uniform float uCore;
  void main(){
    float d = length(gl_PointCoord - 0.5) * 2.0;
    float a = smoothstep(1.0, uCore, d);
    if(a * vAlpha < 0.004) discard;
    gl_FragColor = vec4(vColor, a * vAlpha);
  }`;
const fxScale = {value:400};
function FXPool(n, additive, core){
  const g = new THREE.BufferGeometry();
  this.n = n; this.i = 0;
  this.p = new Float32Array(n*3); this.v = new Float32Array(n*3);
  this.c = new Float32Array(n*3); this.sz = new Float32Array(n); this.al = new Float32Array(n);
  this.life = new Float32Array(n); this.max = new Float32Array(n); this.s0 = new Float32Array(n);
  this.s1 = new Float32Array(n); this.a0 = new Float32Array(n); this.grav = new Float32Array(n);
  this.drag = new Float32Array(n);
  g.setAttribute('position', new THREE.BufferAttribute(this.p, 3));
  g.setAttribute('aColor',   new THREE.BufferAttribute(this.c, 3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(this.sz, 1));
  g.setAttribute('aAlpha',   new THREE.BufferAttribute(this.al, 1));
  this.mat = new THREE.ShaderMaterial({ uniforms:{ uScale:fxScale, uCore:{value:core} },
    vertexShader:FXVS, fragmentShader:FXFS, transparent:true, depthWrite:false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending });
  this.pts = new THREE.Points(g, this.mat); this.pts.frustumCulled = false; scene.add(this.pts);
  this.geo = g;
}
/* o: {life, s0, s1, a, g(重力), drag, col(Color)} */
FXPool.prototype.emit = function(x,y,z, vx,vy,vz, o){
  const i = this.i = (this.i+1) % this.n;
  this.p[i*3]=x; this.p[i*3+1]=y; this.p[i*3+2]=z;
  this.v[i*3]=vx; this.v[i*3+1]=vy; this.v[i*3+2]=vz;
  this.life[i] = this.max[i] = o.life; this.s0[i] = o.s0; this.s1[i] = o.s1;
  this.a0[i] = o.a; this.grav[i] = o.g||0; this.drag[i] = o.drag||0;
  const c = o.col; this.c[i*3]=c.r; this.c[i*3+1]=c.g; this.c[i*3+2]=c.b;
};
FXPool.prototype.update = function(dt){
  for(let i=0;i<this.n;i++){
    if(this.life[i] <= 0){ if(this.al[i]!==0){ this.al[i]=0; this.sz[i]=0; } continue; }
    this.life[i] -= dt;
    const t = 1 - Math.max(0, this.life[i]) / this.max[i];         // 0→1
    const dr = Math.exp(-this.drag[i]*dt);
    this.v[i*3]*=dr; this.v[i*3+2]*=dr; this.v[i*3+1] = this.v[i*3+1]*dr - this.grav[i]*dt;
    this.p[i*3]+=this.v[i*3]*dt; this.p[i*3+1]+=this.v[i*3+1]*dt; this.p[i*3+2]+=this.v[i*3+2]*dt;
    this.sz[i] = this.s0[i] + (this.s1[i]-this.s0[i])*t;
    this.al[i] = this.a0[i] * (t < 0.15 ? t/0.15 : 1) * (1 - t*t);
  }
  const a = this.geo.attributes;
  a.position.needsUpdate = a.aSize.needsUpdate = a.aAlpha.needsUpdate = a.aColor.needsUpdate = true;
};
const puffs = new FXPool(420, false, 0.15);    // 雪煙・着地の輪
const glows = new FXPool(360, true, 0.05);     // 噴射・勢いの尾・火花・結晶の弾け

              gold:new THREE.Color(0xffd36a), ice:new THREE.Color(0x9ff0ff), white:new THREE.Color(0xffffff),

/* 雪煙：後ろへ流れて膨らみながら消える */
function emitSpray(x,y,z,n,pow,up){

/* 着地の輪：足元から横に広がる */
function emitRing(x,y,n,pow){
  const c = snowCol();
  for(let k=0;k<n;k++){

function updateSnow(dt, camX, camY){
  gustT -= dt;
  if(gustT < 0){ gustT = 2 + Math.random()*4; gust = Math.random() < 0.4 ? -4 - Math.random()*6 : 0; }
  const night = AT.night, c = snowCol();
  const fall = 2.4 - night*0.9, wind = -1.2 + gust*0.5;
  for(let i=0;i<SNOWN;i++){
    const L = snowLayer[i], k = L===2 ? 1.6 : (L===1 ? 1.0 : 0.6);
    const ph = snow.v[i*3] += dt*(1.5+L);
    snow.p[i*3]   += (wind*k - G.speed*0.10*k + Math.sin(ph)*0.5)*dt;
    snow.p[i*3+1] += (-fall*k + Math.cos(ph*0.7)*0.3)*dt;
    if(snow.p[i*3] < camX-48) snow.p[i*3] += 96;
    if(snow.p[i*3] > camX+48) snow.p[i*3] -= 96;
    if(snow.p[i*3+1] < camY-18){ snow.p[i*3+1] += 36; snow.p[i*3] = camX + Math.random()*96-48; }
    if(snow.p[i*3+1] > camY+18) snow.p[i*3+1] -= 36;
    snow.c[i*3]=c.r; snow.c[i*3+1]=c.g; snow.c[i*3+2]=c.b;
  }
  const a = snow.geo.attributes;
  a.position.needsUpdate = a.aColor.needsUpdate = true;
  if(!snow._init){ a.aSize.needsUpdate = a.aAlpha.needsUpdate = true; snow._init = true; }
}
